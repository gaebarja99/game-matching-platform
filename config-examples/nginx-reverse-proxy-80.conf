# EC2 등에서 nginx(80) → Spring Boot(8080) 전달용 예시.
#
# 증상: http://서버IP/records 처럼 새로고침 시 nginx가 "404 Not Found" (nginx/1.x) 를 내는 경우
# 원인: location / 가 root 로만 정적 파일을 찾고, /records 파일이 없음. React 라우트는 항상 index.html 로 열려야 함.
#
# 해결 A(권장): 아래처럼 / 를 전부 백엔드로 넘기면 Spring 의 SpaForwardController 가 SPA 폴백 처리.
# 해결 B: 정적 파일을 nginx 가 직접 줄 때는 location / 에 try_files $uri $uri/ /index.html;
#
# 적용: sudo cp ... /etc/nginx/conf.d/gamematcher.conf
#       sudo nginx -t && sudo systemctl reload nginx
#
# --- 공인 IP로만 들어올 때 nip.io(또는 대표 도메인)로 보내기 (HTTP 80만 해당) ---
# http://3.37.67.151/ 처럼 IP로 열면 https://3.37.67.151.nip.io/... 로 301 리다이렉트.
# 주의: https://공인IP/ 는 브라우저가 인증서를 먼저 검사합니다. 인증서가 IP용이 아니면
#       연결이 막혀서 nginx 리다이렉트까지 도달하지 못합니다 → HTTPS는 처음부터 nip.io URL로 열기.
# 아래 IP는 EC2 공인 IP에 맞게 바꾸세요. (443 nip 전용 블록보다 앞에 두면 IP Host 로 들어온 80 요청만 가로챔)
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name 3.37.67.151;
#     return 301 https://3.37.67.151.nip.io$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 업로드/스트림 등 큰 본문이 있으면 조정
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OAuth redirect_uri({baseUrl}): Tomcat이 서버 포트를 8080으로만 보면
        # http://IP:8080/login/oauth2/... 로 나가 콘솔에 등록한 http://IP/... 와 불일치함.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # WebSocket (STOMP /ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTPS(443) 예시: Let's Encrypt 등으로 TLS 를 nginx 에만 두고 Spring 은 8080 HTTP ---
# Google OAuth 리디렉션은 https://도메인/login/oauth2/code/google (포트 생략) 로 등록.
# 브라우저 → 443 TLS → nginx → proxy_pass http://127.0.0.1:8080 (백엔드는 평문 HTTP)
