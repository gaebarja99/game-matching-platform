# nginx-rtmp 샘플 설정 (OBS → RTMP 수신 → HLS 출력)
# 사용: nginx를 nginx-rtmp 모듈과 함께 빌드한 뒤, 이 설정을 포함해 실행.
# Windows: https://github.com/illuspas/nginx-http-flv-module 등 바이너리 참고.

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            # 스트림 키 검증: GameMatcher 백엔드에 요청. 2xx면 허용, 그 외 거부.
            on_publish http://127.0.0.1:8080/api/streams/notify/live;
            on_publish_done http://127.0.0.1:8080/api/streams/notify/end;

            # HLS 출력 (Spring Boot 서버에서 /hls 로 서빙하거나, nginx에서 직접 서빙)
            hls on;
            hls_path /tmp/hls/live;
            hls_fragment 2s;
            hls_playlist_length 6s;
        }
    }
}

# HLS 파일을 HTTP로 서빙 (선택)
# Spring Boot가 /hls 매핑으로 이 경로를 서빙하도록 설정할 수도 있음.
http {
    server {
        listen 8081;
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp/hls;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
