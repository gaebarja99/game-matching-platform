<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?꾩썝 ?ㅻ쾭?덉씠 - GameMatcher</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: transparent; min-height: 100vh; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; pointer-events: none; }

        /* ?щ꽕?댁뀡 ?ㅽ??? ?붾㈃ 以묒븰 怨좎젙, ??踰덉뿉 ?섎굹??*/
        .donation-overlay-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .donation-overlay-root.position-br { align-items: flex-end; justify-content: flex-end; }
        .donation-overlay-root.position-bl { align-items: flex-end; justify-content: flex-start; }
        .donation-overlay-root.position-tr { align-items: flex-start; justify-content: flex-end; }
        .donation-overlay-root.position-tl { align-items: flex-start; justify-content: flex-start; }

        .tonation-card {
            min-width: min(420px, 92vw);
            max-width: 520px;
            padding: 20px 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
            animation: tonation-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .tonation-card.tier-pang { background: linear-gradient(135deg, #0d1f14 0%, #1a2e22 50%, #0d1f14 100%); border: 2px solid #00e676; }
        .tonation-card.tier-super { background: linear-gradient(135deg, #1a1525 0%, #2d2440 50%, #1a1525 100%); border: 2px solid #8b5cf6; }
        .tonation-card.tier-mega { background: linear-gradient(135deg, #251a22 0%, #3d2435 50%, #251a22 100%); border: 2px solid #ec4899; }

        .tonation-tier { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 8px; }
        .tier-pang .tonation-tier { color: #00e676; }
        .tier-super .tonation-tier { color: #a78bfa; }
        .tier-mega .tonation-tier { color: #f472b6; }

        /* ?? ?곗????좊땲硫붿씠??- 媛뺥솕 */
        .pang-burst-wrap {
            margin: 16px 0 20px;
            position: relative;
            width: 120px;
            height: 80px;
            margin-left: auto;
            margin-right: auto;
        }
        .pang-burst-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border-radius: 50%;
            border: 4px solid currentColor;
            animation: pang-ring 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
            opacity: 0;
            pointer-events: none;
        }
        .tier-pang .pang-burst-ring { color: #00e676; }
        .tier-super .pang-burst-ring { color: #a78bfa; }
        .tier-mega .pang-burst-ring { color: #ec4899; }
        .pang-burst {
            position: relative;
            z-index: 2;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 24px currentColor, 0 0 48px currentColor, 0 2px 4px rgba(0,0,0,0.5);
            animation: pang-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            opacity: 0;
            transform: scale(0.2);
            will-change: transform, opacity;
        }
        .tier-pang .pang-burst { color: #00e676; }
        .tier-super .pang-burst { color: #c4b5fd; }
        .tier-mega .pang-burst { color: #f9a8d4; }
        .pang-burst-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 80px;
            height: 80px;
            margin: -40px 0 0 -40px;
            border-radius: 50%;
            animation: pang-glow 1s ease-out 0.25s forwards;
            opacity: 0;
            pointer-events: none;
        }
        .tier-pang .pang-burst-glow { background: radial-gradient(circle, rgba(0,230,118,0.55) 0%, rgba(0,230,118,0.2) 40%, transparent 70%); }
        .tier-super .pang-burst-glow { background: radial-gradient(circle, rgba(139,92,246,0.55) 0%, rgba(139,92,246,0.2) 40%, transparent 70%); }
        .tier-mega .pang-burst-glow { background: radial-gradient(circle, rgba(236,72,153,0.55) 0%, rgba(236,72,153,0.2) 40%, transparent 70%); }

        .tonation-text { font-size: clamp(1rem, 2.5vw, 1.35rem); font-weight: 700; color: #fff; line-height: 1.5; }
        .tonation-text .donor-name { font-weight: 800; }
        .tier-pang .tonation-text .donor-name { color: #7dffb3; }
        .tier-super .tonation-text .donor-name { color: #e9d5ff; }
        .tier-mega .tonation-text .donor-name { color: #fbcfe8; }
        .tonation-msg { margin-top: 10px; padding: 8px 12px; background: rgba(255,255,255,0.1); border-radius: 8px; font-size: 0.95rem; color: #e5e5e7; text-align: left; }
        .tonation-consecutive { margin-top: 8px; font-size: 0.9rem; font-weight: 700; color: #fef08a; }

        @keyframes tonation-in {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes pang-pop {
            0%   { opacity: 0; transform: scale(0.2); }
            45%  { opacity: 1; transform: scale(1.4); }
            70%  { opacity: 1; transform: scale(0.95); }
            85%  { opacity: 1; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pang-ring {
            0%   { opacity: 0.9; transform: scale(0.3); }
            100% { opacity: 0;   transform: scale(2.5); }
        }
        @keyframes pang-glow {
            0%   { opacity: 0.9; transform: scale(0.4); }
            100% { opacity: 0;   transform: scale(2.2); }
        }
    </style>
</head>
<body>
    <div id="donation-root" class="donation-overlay-root position-br" aria-live="polite"></div>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var streamId = params.get('streamId') || params.get('streamid');
            var position = (params.get('position') || params.get('pos') || 'br').toLowerCase();
            if (['br', 'bl', 'tr', 'tl'].indexOf(position) === -1) position = 'br';
            var root = document.getElementById('donation-root');
            root.className = 'donation-overlay-root position-' + position;

            if (!streamId) {
                root.innerHTML = '<div style="padding:12px;background:rgba(0,0,0,0.7);color:#fff;border-radius:8px;font-size:14px;">URL??streamId媛 ?꾩슂?⑸땲?? ?? ?streamId=18&position=br</div>';
                return;
            }

            function tierClass(tier) {
                return tier === '硫붽??? ? 'tier-mega' : (tier === '?덊띁?? ? 'tier-super' : 'tier-pang');
            }
            function esc(s) {
                if (!s) return '';
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function playDonationSound(amount) {
                var num = Number(amount) || 0;
                var src = '/후원사운드/1000~9999.mp3';
                if (num >= 100000) {
                    src = '/후원사운드/100000~.mp3';
                } else if (num >= 10000) {
                    src = '/후원사운드/10000~99999.mp3';
                }
                try {
                    var audio = new Audio(src);
                    audio.volume = 0.8;
                    audio.play().catch(function() {});
                } catch (e) {}
            } catch (e) {}
            }

            function showDonation(data) {
                var donorName = (data && data.donorName) ? data.donorName : '?듬챸';
                var amount = (data && data.amount) != null ? Number(data.amount) : 0;
                var tier = (data && data.tier) ? data.tier : '??;
                var donorMessage = (data && data.donorMessage) ? String(data.donorMessage).trim() : '';
                var consecutiveDays = (data && data.consecutiveDonationDays) != null ? parseInt(data.consecutiveDonationDays, 10) : 0;
                var donorNameTrim = (donorName && String(donorName).trim()) ? String(donorName).trim() : '?듬챸';
                var tierCls = tierClass(tier);

                playDonationSound(amount);

                var card = document.createElement('div');
                card.className = 'tonation-card ' + tierCls;
                card.innerHTML =
                    '<div class="tonation-tier">' + esc(tier) + '</div>' +
                    '<div class="pang-burst-wrap">' +
                    '<div class="pang-burst-ring" aria-hidden="true"></div>' +
                    '<div class="pang-burst-glow" aria-hidden="true"></div>' +
                    '<div class="pang-burst">??</div>' +
                    '</div>' +
                    '<div class="tonation-text">' +
                    '<span class="donor-name">' + esc(donorNameTrim) + '?섏씠</span> ' + amount.toLocaleString() + '???꾩썝! ??' +
                    '</div>' +
                    (donorMessage ? '<div class="tonation-msg">' + esc(donorMessage) + '</div>' : '') +
                    (consecutiveDays >= 1 ? '<div class="tonation-consecutive">?곗냽?꾩썝 ' + consecutiveDays + '??/div>' : '');
                root.innerHTML = '';
                root.appendChild(card);
                void card.offsetHeight;

                setTimeout(function () {
                    if (card.parentNode) card.parentNode.removeChild(card);
                }, 5500);
            }

            function connect() {
                try {
                    var client = new StompJs.Client({
                        webSocketFactory: function () { return new SockJS(location.origin + '/ws'); },
                        reconnectDelay: 3000,
                        onConnect: function () {
                            client.subscribe('/topic/stream/' + streamId, function (msg) {
                                if (!msg || !msg.body) return;
                                try {
                                    var d = JSON.parse(msg.body);
                                    if (d && d.type === 'donation') showDonation(d);
                                } catch (e) {}
                            });
                        }
                    });
                    client.activate();
                } catch (e) {}
            }
            connect();
        })();
    </script>
</body>
</html>
