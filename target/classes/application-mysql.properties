# MySQL (프로필: mysql) - java -Dspring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/GameMatcher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# React 프론트엔드 URL (분리형). CORS 및 OAuth 리다이렉트에 사용
# localhost와 127.0.0.1 모두 허용 (CORS)
app.frontend.url=http://localhost:5173,http://127.0.0.1:5173

# 구글 로그인: 프로필 oauth 활성화 시 application-oauth.properties 로드. 환경변수 GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET 설정
