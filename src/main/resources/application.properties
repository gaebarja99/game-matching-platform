# Server Configuration
server.port=8080

# Session: 7 days. Cookie max-age 604800.
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=604800
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Application Name
spring.application.name=gamematcher

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:gamematcherdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OBS / RTMP streaming. HLS on port 8000 (node-media-server). nginx-rtmp: use http://localhost:8080/hls
app.streaming.rtmp-server-url=rtmp://localhost/live
app.streaming.hls-base-url=http://localhost:8000
# app.streaming.hls-file-path=C:/hls

# Upload path for profile images etc.
cdapp.upload.path=./uploads

# Frontend URL for CORS and OAuth redirect (Vite default port 5173)
app.frontend.url=http://localhost:5173,http://127.0.0.1:5173

# 포트원(아임포트) 결제. 로컬 값은 application-portone-local.properties 에 두세요 (Git 제외)
spring.profiles.include=portone-local

# reCAPTCHA Enterprise (optional). Set api-key, site-key if enabled.
app.recaptcha.enabled=false
app.recaptcha.project-id=gamematcher-ddec4
app.recaptcha.site-key=6LfBwYgsAAAAAFYOrpLwfsb9n_juEVlFH9xRZTeb
# app.recaptcha.api-key=your-google-cloud-api-key

# Firebase Cloud Messaging (push)
app.firebase.push.enabled=false
# Windows example: C:/keys/firebase-service-account.json
app.firebase.push.service-account-path=

# SMS (Naver Cloud SENS)
app.sms.enabled=false
app.sms.provider=naver-sens
app.sms.base-url=https://sens.apigw.ntruss.com
app.sms.service-id=
app.sms.access-key=
app.sms.secret-key=
app.sms.from-number=
app.sms.country-code=82

# Chatbot / Ollama
ollama.base-url=http://localhost:11434
ollama.model=llama3.1:8b

