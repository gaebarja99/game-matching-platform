# Server Configuration
server.port=8080

# Application Name
spring.application.name=gamematcher

# 샘플 데이터 로드: sample 프로필 활성화 시 ApplicationRunner로 DB 삽입
# 주석 해제 시 기동할 때마다 샘플 데이터 로드 시도 (중복은 스킵)
spring.profiles.active=default,sample

spring.datasource.url=jdbc:mysql://localhost:3306/gamematcher?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Riot API Key (환경변수 RIOT_API_KEY 설정 필요)
riot.api.key=${RIOT_API_KEY:RGAPI-3b4da634-3ffe-4f6d-8ddc-15a7620fc9a9}

# Riot Regional Base URL
riot.api.regional-base-url=https://asia.api.riotgames.com

# Riot Platform Base URL
riot.api.platform-base-url=https://kr.api.riotgames.com

# Valorant Henrik API (환경변수 VALORANT_API_KEY 설정 필요)
valorant.api.base-url=https://api.henrikdev.xyz
valorant.api.key=${VALORANT_API_KEY:HDEV-09865592-1813-4933-84ce-c7dd534e16a1}

# Admin API Key (운영환경 필수: /api/admin/* 접근 시 X-Admin-Key 헤더 필요)
# 비워두면 개발 모드(검증 생략)
admin.api.key=${ADMIN_API_KEY:}

# LLM API (환경변수 AI_API_KEY 설정 필요)
ai.llm.provider=openai
ai.llm.api-key=${AI_API_KEY:}
ai.llm.model=gpt-4o-mini
ai.llm.timeout-seconds=15
ai.llm.max-retries=2

# Community file upload
community.upload.path=${COMMUNITY_UPLOAD_PATH:./uploads/community}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB