# Server Configuration
server.port=8080
# nginx(80)→Tomcat(8080) 시 X-Forwarded-Port/Host 없으면 OAuth redirect_uri 가 :8080 으로 나가
# 카카오·구글·네이버 콘솔의 콜백 URL(보통 :80 생략)과 맞지 않음 → config-examples/nginx-reverse-proxy-80.conf 참고
server.forward-headers-strategy=framework

# SpaForwardController 의 /**/{segment:…} 패턴은 PathPattern 에서 허용되지 않음 → Ant 매칭 사용
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Session: 7 days. Cookie max-age 604800.
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=604800
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Application Name
spring.application.name=gamematcher

# 소셜 로그인: oauth 프로필만으로는 EC2 등에서 SPRING_PROFILES_ACTIVE 로 덮어쓰면 빠질 수 있어, OAuth 설정 파일을 항상 import
spring.config.import=optional:classpath:application-oauth.properties

# DB: 그냥 mvn spring-boot:run 이면 아래 RDS(팀/배포용). PC에서 RDS 막히면 타임아웃 남.
# 로컬 테스트: H2 → mvn spring-boot:run -Plocal-db  또는  mvn spring-boot:run "-Dspring-boot.run.profiles=local"
# 로컬 MySQL: mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:mariadb://database-1.c5ko24oea6zz.ap-northeast-2.rds.amazonaws.com:3306/project_db?useSSL=true&trustServerCertificate=true
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=admin
spring.datasource.password=12345678

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OBS / RTMP streaming. HLS on port 8000 (node-media-server). nginx-rtmp: use http://3.37.67.151:8080/hls
# 공인 IP/도메인은 EC2 Elastic IP 또는 실제 주소로 맞춤 (보안그룹: TCP 1935 RTMP, 8000 HLS)
app.streaming.rtmp-server-url=rtmp://3.37.67.151/live
app.streaming.hls-base-url=http://3.37.67.151:8000
# app.streaming.hls-file-path=/var/hls
# 비우면 FFMPEG_PATH → PATH의 ffmpeg 순. EC2: dnf/apt 로 설치 후 PATH에 두거나 systemd Environment=FFMPEG_PATH=/usr/bin/ffmpeg
app.streaming.ffmpeg-path=

# Upload path for profile images etc.
cdapp.upload.path=./uploads

# 프론트 주소(CORS·OAuth 리다이렉트·Referer). 구글 redirect 와 같이 https+nip 로 접속할 것(4번 통일).
# 다른 도메인이면 APP_FRONTEND_PUBLIC_URL 로 덮어쓰기.
app.frontend.url=${APP_FRONTEND_PUBLIC_URL:https://3.37.67.151.nip.io}

# 포트원(아임포트) 결제. 로컬 값은 application-portone-local.properties 에 두세요 (Git 제외)
# Local secret profiles:
# - application-portone-local.properties
# - application-sms-local.properties
# Both files are gitignored and should be created only on local/server environments.
# application-oauth.properties 는 위 spring.config.import 로 이미 로드됨. (oauth 프로필 중복 로드 방지로 여기서는 제외)
spring.profiles.include=portone-local,sms-local,riot-local

