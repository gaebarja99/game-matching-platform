# Server Configuration
server.port=8080

# 분리형 프론트(Vite 등) CORS. 콤마로 여러 Origin. credentials: include 호출 시 필수.
# 비우면 브라우저에서 다른 오리진(예: :5173 → :8080) API 호출 시 프리플라이트 실패.
app.frontend.url=http://localhost:5173,http://127.0.0.1:5173

# Application Name
spring.application.name=gamematcher

# 로컬 개발: true면 기동 시 demo1, demo2, admin1 데모 유저+프로필 생성(동일 loginId 있으면 스킵). 비밀번호 demo1234
gamematcher.seed-sample-users=true

spring.datasource.url=jdbc:mysql://localhost:3306/gamematcher?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Riot API Key
riot.api.key=${RIOT_API_KEY:RGAPI-58751481-1660-4a52-9bfe-218645d547d4}

# Riot Regional Base URL
