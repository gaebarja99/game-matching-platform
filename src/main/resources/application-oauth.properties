# 구글 소셜 로그인 (application.properties 의 spring.config.import 로 로드)
# 1. Google Cloud Console → API 및 서비스 → 사용자 인증 정보 → OAuth 2.0 클라이언트 ID 생성 (웹 애플리케이션)
# 2. 승인된 리디렉션 URI: 로컬 + 배포 URL 모두 등록 (예: http://localhost:8080/login/oauth2/code/google)
#    AWS는 브라우저 기준 공인 주소와 동일해야 함. nginx(80)→8080 이면 redirect_uri 가 :8080 으로 나가면 실패하므로
#    nginx 에 X-Forwarded-Port/X-Forwarded-Host 설정 필수 (config-examples/nginx-reverse-proxy-80.conf)
# 3. 환경변수 GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET 이 있으면 우선 사용. 없으면 아래 기본값 사용 (배포 시 env 권장)
# 구글만 redirect-uri 고정: 콘솔 등록 URI 와 동일해야 함. 로컬은 application-local.properties 또는 GOOGLE_OAUTH_REDIRECT_BASE 로 덮어쓰기.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:879767507887-4iookphdl9ei8lhn8cshpj2qrgvtmnbk.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_BASE:http://3.37.67.151.nip.io:8080}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# 카카오 소셜 로그인 (미설정 시 '카카오 로그인' 클릭해도 카카오 페이지로 가지 않고 로그인 화면으로 돌아갑니다)
# 1. developers.kakao.com → 내 애플리케이션 → 앱 생성 → 카카오 로그인 활성화
# 2. 플랫폼 → 플랫폼 키 → 카카오 로그인 리다이렉트 URI 에 반드시 아래 둘 다 등록 (포트 8080, 경로 oauth2)
#    http://localhost:8080/login/oauth2/code/kakao
#    http://127.0.0.1:8080/login/oauth2/code/kakao
# 3. 동의 항목: 닉네임, 프로필 사진, 카카오계정(이메일) 필요 시 설정
# 4. 앱 키에서 "REST API 키" 복사. client-secret은 application-oauth-local.properties 또는 KAKAO_CLIENT_SECRET 환경변수로만 설정 (여기서 빈 값으로 덮지 않음)
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:577fe6bba25ec09018116e41e9ab1da4}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
# 카카오는 Basic 헤더가 아닌 POST body로 client_id/client_secret 전송 (client_secret_post)
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 네이버 소셜 로그인 (미설정 시 '네이버 로그인' 클릭 시 로그인 화면으로 리다이렉트)
# 1. developers.naver.com → 애플리케이션 등록 → API 설정 → 로그인 오픈 API 서비스 환경: 웹 애플리케이션
# 2. 서비스 URL: http://localhost:8080 (또는 배포 URL), callback URL: http://localhost:8080/login/oauth2/code/naver (및 127.0.0.1 동일 경로)
# 3. 클라이언트 ID·시크릿을 NAVER_CLIENT_ID, NAVER_CLIENT_SECRET 환경변수 또는 application-oauth-local.properties 로 설정
#    기본값 not-configured 는 빈 값이면 Spring 검증 실패를 막기 위함. 실제 미설정 시 OAuth2NaverNotConfiguredFilter 가 로그인 페이지로 리다이렉트.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# 로컬 시크릿: 이 import는 "맨 마지막"에 처리되므로, 위의 not-configured 기본값을 실제 값으로 덮어씀.
# (application.properties에 두면 application-oauth.properties가 나중에 로드되어 not-configured로 덮어써서, 여기서만 import)
spring.config.import=optional:file:./application-oauth-local.properties,optional:classpath:application-oauth-local.properties
