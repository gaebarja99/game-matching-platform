<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후원 애니메이션 오버레이</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: "Noto Sans KR", sans-serif;
            pointer-events: none;
        }

        .overlay-root {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .overlay-root.position-br { align-items: flex-end; justify-content: flex-end; }
        .overlay-root.position-bl { align-items: flex-end; justify-content: flex-start; }
        .overlay-root.position-tr { align-items: flex-start; justify-content: flex-end; }
        .overlay-root.position-tl { align-items: flex-start; justify-content: flex-start; }

        .donation-card {
            min-width: min(430px, 92vw);
            max-width: 540px;
            padding: 22px 24px;
            border-radius: 20px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .donation-card.tier-pang {
            background: linear-gradient(135deg, rgba(10, 26, 18, 0.95), rgba(17, 54, 36, 0.92));
            border-color: rgba(36, 240, 128, 0.65);
        }

        .donation-card.tier-super {
            background: linear-gradient(135deg, rgba(22, 14, 40, 0.95), rgba(60, 36, 103, 0.92));
            border-color: rgba(168, 85, 247, 0.65);
        }

        .donation-card.tier-mega {
            background: linear-gradient(135deg, rgba(46, 9, 27, 0.96), rgba(125, 28, 72, 0.92));
            border-color: rgba(244, 114, 182, 0.7);
        }

        .donation-tier {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .tier-pang .donation-tier { color: #58f59a; }
        .tier-super .donation-tier { color: #d6bcff; }
        .tier-mega .donation-tier { color: #ffb7d8; }

        .pang-burst-wrap {
            position: relative;
            width: 128px;
            height: 88px;
            margin: 14px auto 18px;
        }

        .pang-burst-ring,
        .pang-burst-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 999px;
        }

        .pang-burst-ring {
            width: 24px;
            height: 24px;
            border: 4px solid currentColor;
            opacity: 0;
            animation: ring-out 0.95s ease-out 0.1s forwards;
        }

        .tier-pang .pang-burst-ring { color: #24f080; }
        .tier-super .pang-burst-ring { color: #b98cff; }
        .tier-mega .pang-burst-ring { color: #ff77bc; }

        .pang-burst-glow {
            width: 90px;
            height: 90px;
            opacity: 0;
            animation: glow-out 0.95s ease-out 0.18s forwards;
        }

        .tier-pang .pang-burst-glow {
            background: radial-gradient(circle, rgba(36, 240, 128, 0.48) 0%, rgba(36, 240, 128, 0.18) 42%, transparent 72%);
        }

        .tier-super .pang-burst-glow {
            background: radial-gradient(circle, rgba(185, 140, 255, 0.48) 0%, rgba(185, 140, 255, 0.18) 42%, transparent 72%);
        }

        .tier-mega .pang-burst-glow {
            background: radial-gradient(circle, rgba(255, 119, 188, 0.48) 0%, rgba(255, 119, 188, 0.18) 42%, transparent 72%);
        }

        .pang-burst {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(44px, 9vw, 72px);
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 18px currentColor, 0 0 36px currentColor, 0 3px 10px rgba(0, 0, 0, 0.45);
            opacity: 0;
            transform: scale(0.2);
            animation: pang-pop 0.72s cubic-bezier(0.34, 1.56, 0.64, 1) 0.22s forwards;
        }

        .tier-pang .pang-burst { color: #7effb2; }
        .tier-super .pang-burst { color: #e2ccff; }
        .tier-mega .pang-burst { color: #ffd1e7; }

        .donation-text {
            font-size: clamp(18px, 2.4vw, 24px);
            font-weight: 700;
            line-height: 1.5;
            word-break: keep-all;
        }

        .donation-text .donor-name {
            font-weight: 900;
        }

        .tier-pang .donation-text .donor-name { color: #9fffc8; }
        .tier-super .donation-text .donor-name { color: #eedfff; }
        .tier-mega .donation-text .donor-name { color: #ffd9ea; }

        .donation-message {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.10);
            color: #f4f4f5;
            font-size: 15px;
            line-height: 1.5;
            text-align: left;
            word-break: break-word;
        }

        .donation-consecutive {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 800;
            color: #fef08a;
        }

        .overlay-warning {
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 14px;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(18px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pang-pop {
            0% { opacity: 0; transform: scale(0.2); }
            45% { opacity: 1; transform: scale(1.36); }
            70% { opacity: 1; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes ring-out {
            0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.25); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); }
        }

        @keyframes glow-out {
            0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.45); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.1); }
        }
    </style>
</head>
<body>
<div id="donation-root" class="overlay-root position-br" aria-live="polite"></div>

<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var streamId = params.get("streamId") || params.get("streamid");
        var position = (params.get("position") || params.get("pos") || "br").toLowerCase();
        var root = document.getElementById("donation-root");
        var allowedPositions = ["br", "bl", "tr", "tl"];

        if (!allowedPositions.includes(position)) {
            position = "br";
        }
        root.className = "overlay-root position-" + position;

        if (!streamId) {
            root.innerHTML = '<div class="overlay-warning">URL에 streamId가 필요합니다. 예: ?streamId=18&position=br</div>';
            return;
        }

        function escapeHtml(value) {
            if (value == null) return "";
            var div = document.createElement("div");
            div.textContent = String(value);
            return div.innerHTML;
        }

        function tierClass(tier) {
            if (tier === "메가 팡") return "tier-mega";
            if (tier === "슈퍼 팡") return "tier-super";
            return "tier-pang";
        }

        function playDonationSound(amount) {
            var numericAmount = Number(amount) || 0;
            var src = "/후원사운드/1000~9999.mp3";

            if (numericAmount >= 100000) {
                src = "/후원사운드/100000~.mp3";
            } else if (numericAmount >= 10000) {
                src = "/후원사운드/10000~99999.mp3";
            }

            try {
                var audio = new Audio(src);
                audio.volume = 0.8;
                audio.play().catch(function () {});
            } catch (error) {
                console.warn("Failed to play donation sound", error);
            }
        }

        function showDonation(data) {
            if (!data) return;

            var donorName = String(data.donorName || "익명").trim() || "익명";
            var amount = Number(data.amount) || 0;
            var tier = String(data.tier || "팡");
            var donorMessage = data.donorMessage ? String(data.donorMessage).trim() : "";
            var consecutiveDays = data.consecutiveDonationDays != null ? parseInt(data.consecutiveDonationDays, 10) : 0;
            var cls = tierClass(tier);

            playDonationSound(amount);

            var card = document.createElement("div");
            card.className = "donation-card " + cls;
            card.innerHTML =
                '<div class="donation-tier">' + escapeHtml(tier) + '</div>' +
                '<div class="pang-burst-wrap">' +
                    '<div class="pang-burst-ring" aria-hidden="true"></div>' +
                    '<div class="pang-burst-glow" aria-hidden="true"></div>' +
                    '<div class="pang-burst">팡</div>' +
                '</div>' +
                '<div class="donation-text"><span class="donor-name">' + escapeHtml(donorName) + '</span>님이 ' + amount.toLocaleString("ko-KR") + '팡 후원!</div>' +
                (donorMessage ? '<div class="donation-message">' + escapeHtml(donorMessage) + '</div>' : '') +
                (consecutiveDays >= 1 ? '<div class="donation-consecutive">연속 후원 ' + consecutiveDays + '일째</div>' : '');

            root.innerHTML = "";
            root.appendChild(card);

            window.clearTimeout(window.__donationOverlayTimer);
            window.__donationOverlayTimer = window.setTimeout(function () {
                if (card.parentNode) {
                    card.parentNode.removeChild(card);
                }
            }, 5500);
        }

        function connect() {
            try {
                var client = new StompJs.Client({
                    webSocketFactory: function () {
                        return new SockJS(window.location.origin + "/ws");
                    },
                    reconnectDelay: 3000,
                    onConnect: function () {
                        client.subscribe("/topic/stream/" + streamId, function (message) {
                            if (!message || !message.body) return;
                            try {
                                var payload = JSON.parse(message.body);
                                if (payload && payload.type === "donation") {
                                    showDonation(payload);
                                }
                            } catch (error) {
                                console.warn("Failed to parse donation payload", error);
                            }
                        });
                    },
                    onStompError: function (frame) {
                        console.warn("Donation overlay STOMP error", frame);
                    }
                });

                client.activate();
            } catch (error) {
                console.warn("Donation overlay websocket connect failed", error);
            }
        }

        connect();
    })();
</script>
</body>
</html>
