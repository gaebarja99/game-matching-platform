<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스트리머 관리 - GameMatcher 스튜디오</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/typography-glitch.css">
    <script src="/js/alert-popup.js"></script>
    <style>
        :root { --studio-bg: #0e0e10; --studio-bg-elevated: #18181b; --studio-bg-card: #26262c; --studio-border: #26262c; --studio-border-strong: #3a3a3d; --studio-text: #efeff1; --studio-text-muted: #adadb8; --studio-text-heading: #fff; --studio-accent: #a970ff; --studio-accent-hover: #bf94ff; --studio-accent-bg: rgba(169,112,255,0.15); }
        body.theme-light { --studio-bg: #f7f7f8; --studio-bg-elevated: #fff; --studio-bg-card: #efeff1; --studio-border: #d0d0d2; --studio-bg-hover: #e5e5e7; --studio-text: #1a1a1d; --studio-text-muted: #53535a; --studio-text-heading: #0e0e10; --studio-accent: #9147ff; --studio-accent-hover: #772ce8; --studio-accent-bg: rgba(145,71,255,0.12); }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; min-height: 100vh; background: var(--studio-bg); color: var(--studio-text); display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }
        a { color: inherit; text-decoration: none; }
        .studio-header { height: 56px; border-bottom: 1px solid var(--studio-border); display: flex; align-items: center; padding: 0 20px; background: var(--studio-bg); }
        .studio-header .menu-btn { width: 40px; height: 40px; border: none; background: none; color: var(--studio-text-muted); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .studio-header .menu-btn:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-header .logo { font-weight: 700; font-size: 1.2rem; margin-left: 12px; color: var(--studio-text-heading); }
        .studio-header .logo span { color: var(--studio-accent); }
        .studio-header .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .studio-header .btn-create { padding: 8px 16px; background: var(--studio-accent); color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
        .studio-header .btn-create:hover { background: var(--studio-accent-hover); }
        .studio-header .icon-btn, .studio-header .theme-toggle { width: 40px; height: 40px; border: none; background: none; color: var(--studio-text-muted); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .studio-header .icon-btn:hover, .studio-header .theme-toggle:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-header .theme-toggle .icon-sun { display: none; } .studio-header .theme-toggle .icon-moon { display: block; }
        body.theme-light .studio-header .theme-toggle .icon-sun { display: block; } body.theme-light .studio-header .theme-toggle .icon-moon { display: none; }
        .studio-header .profile-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--studio-bg-card); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--studio-text-muted); }
        .studio-body { display: flex; flex: 1; min-height: 0; }
        .studio-sidebar { width: 240px; min-width: 240px; flex-shrink: 0; padding: 16px 0; border-right: 1px solid var(--studio-border); background: var(--studio-bg); overflow-y: auto; }
        .studio-sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 0.9rem; color: var(--studio-text-muted); border: none; background: none; width: 100%; text-align: left; font-family: inherit; border-radius: 0 6px 6px 0; margin: 0 12px 0 0; cursor: pointer; }
        .studio-sidebar .nav-item:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-sidebar .nav-item.active { color: var(--studio-accent); background: var(--studio-accent-bg); font-weight: 600; }
        .studio-sidebar .nav-item .icon { font-size: 1.1rem; width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .studio-sidebar .nav-item .nav-arrow { margin-left: auto; font-size: 0.7rem; transition: transform 0.2s; }
        .studio-sidebar .nav-group.open .nav-item.nav-trigger .nav-arrow { transform: rotate(180deg); }
        .studio-sidebar .nav-sub { display: none; list-style: none; margin: 0; padding: 0 0 4px 0; }
        .studio-sidebar .nav-group.open .nav-sub { display: block; }
        .studio-sidebar .nav-sub a { display: flex; align-items: center; gap: 10px; padding: 8px 20px 8px 48px; font-size: 0.85rem; color: var(--studio-text-muted); border-radius: 0 6px 6px 0; margin: 0 12px 0 0; }
        .studio-sidebar .nav-sub a:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-sidebar .nav-sub a.active { color: var(--studio-accent); background: var(--studio-accent-bg); font-weight: 600; }
        .studio-sidebar .nav-divider { height: 1px; background: var(--studio-border); margin: 12px 20px; }
        .studio-main { flex: 1; padding: 28px 32px; overflow-y: auto; min-width: 0; }
        .page-title { font-size: 1.35rem; font-weight: 700; color: var(--studio-text-heading); margin: 0 0 20px 0; }
        .admin-card { background: var(--studio-bg-elevated); border: 1px solid var(--studio-border); border-radius: 12px; padding: 24px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--studio-border); font-size: 0.9rem; }
        .data-table th { background: var(--studio-bg-card); color: var(--studio-text-muted); font-weight: 600; }
        .data-table .empty-msg { text-align: center; padding: 48px 20px; color: var(--studio-text-muted); }
        .tier-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .tier-badge.GENERAL { background: rgba(107,107,112,0.3); color: var(--studio-text-muted); }
        .tier-badge.PARTNER { background: rgba(169,112,255,0.2); color: var(--studio-accent); }
        .btn-tier { padding: 6px 12px; margin-right: 6px; border: 1px solid var(--studio-border-strong); border-radius: 6px; background: var(--studio-bg-card); color: var(--studio-text); font-size: 0.85rem; cursor: pointer; }
        .btn-tier:hover { background: var(--studio-accent-bg); border-color: var(--studio-accent); color: var(--studio-accent); }
        .btn-tier.active { background: var(--studio-accent-bg); border-color: var(--studio-accent); color: var(--studio-accent); }
    </style>
</head>
<body>
    <header class="studio-header">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="메뉴"><svg class="icon-menu" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a href="/streams.html" class="logo">GameMatcher <span>스튜디오</span></a>
        <div class="header-right">
            <a href="/studio-live.html" class="btn-create">+ 만들기</a>
            <button type="button" class="icon-btn" title="도움말" onclick="alert('도움말은 준비 중입니다.');"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
            <a href="/studio-alerts.html" class="icon-btn" title="알림"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
            <button type="button" class="theme-toggle" id="theme-toggle" title="다크/라이트 모드 전환" aria-label="테마 전환">
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="/profile.html" class="profile-btn" title="프로필"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></a>
        </div>
    </header>
    <div class="studio-body">
        <aside class="studio-sidebar">
            <a href="/studio.html" class="nav-item"><span class="icon">▣</span> 대시보드</a>
            <div class="nav-group open" data-group="revenue">
                <button type="button" class="nav-item nav-trigger"><span class="icon">💰</span> 수익 관리 <span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="/studio-revenue.html">수익 창출</a></li>
                    <li><a href="/studio-admin-streamers.html" class="active">스트리머 관리</a></li>
                </ul>
            </div>
            <div class="nav-divider"></div>
            <a href="/profile.html" class="nav-item"><span class="icon">👤</span> 내 정보</a>
        </aside>
        <main class="studio-main">
            <h1 class="page-title">스트리머 관리</h1>
            <p style="color: var(--studio-text-muted); margin-bottom: 20px;">일반 스트리머(팡 수수료 30%) / 파트너 스트리머(팡 수수료 20%). 운영자만 구분 변경 가능합니다.</p>
            <div class="admin-card">
                <table class="data-table">
                    <thead>
                        <tr><th>아이디</th><th>이름</th><th>구분</th><th>받은 팡</th><th>변경</th></tr>
                    </thead>
                    <tbody id="streamer-tbody">
                        <tr><td colspan="5" class="empty-msg">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        (function () {
            var THEME_KEY = 'studio-theme';
            function applyTheme(light) { document.body.classList.toggle('theme-light', !!light); if (light) localStorage.setItem(THEME_KEY, 'light'); else localStorage.removeItem(THEME_KEY); }
            applyTheme(localStorage.getItem(THEME_KEY) === 'light');
            var themeBtn = document.getElementById('theme-toggle');
            if (themeBtn) themeBtn.onclick = function () { applyTheme(!document.body.classList.contains('theme-light')); };
            document.querySelectorAll('.nav-group .nav-trigger').forEach(function (b) { b.onclick = function () { this.closest('.nav-group').classList.toggle('open'); }; });
            var menuBtn = document.getElementById('menu-btn');
            if (menuBtn) menuBtn.onclick = function () { var s = document.querySelector('.studio-sidebar'); s.style.display = s.style.display === 'none' ? 'block' : 'none'; };

            fetch('/api/auth/me', { credentials: 'include' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (me) {
                    if (!me || me.role !== 'ADMIN') {
                        window.location.href = '/studio.html';
                        return;
                    }
                    loadStreamers();
                })
                .catch(function () { window.location.href = '/studio.html'; });

            function loadStreamers() {
                fetch('/api/admin/streamers', { credentials: 'include' })
                    .then(function (r) {
                        if (r.status === 403) { window.location.href = '/studio.html'; return []; }
                        return r.json();
                    })
                    .then(function (list) {
                        var tbody = document.getElementById('streamer-tbody');
                        if (!list || list.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">스트리머가 없습니다.</td></tr>';
                            return;
                        }
                        tbody.innerHTML = list.map(function (s) {
                            var tier = s.streamerTier || 'GENERAL';
                            var tierLabel = tier === 'PARTNER' ? '파트너 스트리머 (20%)' : '일반 스트리머 (30%)';
                            return '<tr data-id="' + s.id + '">' +
                                '<td>' + (s.loginId || '') + '</td>' +
                                '<td>' + (s.displayName || '') + '</td>' +
                                '<td><span class="tier-badge ' + tier + '">' + tierLabel + '</span></td>' +
                                '<td>' + (s.totalReceivedPang != null ? s.totalReceivedPang.toLocaleString() : 0) + '</td>' +
                                '<td><button type="button" class="btn-tier' + (tier === 'GENERAL' ? ' active' : '') + '" data-tier="GENERAL">일반</button><button type="button" class="btn-tier' + (tier === 'PARTNER' ? ' active' : '') + '" data-tier="PARTNER">파트너</button></td></tr>';
                        }).join('');
                        tbody.querySelectorAll('button.btn-tier').forEach(function (btn) {
                            btn.addEventListener('click', function () {
                                var row = this.closest('tr');
                                var userId = row.getAttribute('data-id');
                                var newTier = this.getAttribute('data-tier');
                                if (!userId || !newTier) return;
                                fetch('/api/admin/streamers/' + userId + '/tier', {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    credentials: 'include',
                                    body: JSON.stringify({ tier: newTier })
                                })
                                    .then(function (r) { return r.json(); })
                                    .then(function (res) {
                                        if (res.message) loadStreamers();
                                    });
                            });
                        });
                    })
                    .catch(function () {
                        document.getElementById('streamer-tbody').innerHTML = '<tr><td colspan="5" class="empty-msg">목록을 불러올 수 없습니다.</td></tr>';
                    });
            }
        })();
    </script>
</body>
</html>
