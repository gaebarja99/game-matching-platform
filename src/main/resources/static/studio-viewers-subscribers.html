<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독자 - GameMatcher 스튜디오</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/typography-glitch.css">
    <script src="/js/alert-popup.js"></script>
    <style>
        :root { --studio-bg: #0e0e10; --studio-bg-elevated: #18181b; --studio-bg-hover: #1f1f23; --studio-bg-card: #26262c; --studio-border: #26262c; --studio-border-strong: #3a3a3d; --studio-text: #efeff1; --studio-text-muted: #adadb8; --studio-text-dim: #6b6b70; --studio-text-heading: #fff; --studio-accent: #a970ff; --studio-accent-hover: #bf94ff; --studio-accent-bg: rgba(169,112,255,0.15); }
        body.theme-light { --studio-bg: #f7f7f8; --studio-bg-elevated: #fff; --studio-bg-hover: #e5e5e7; --studio-bg-card: #efeff1; --studio-border: #d0d0d2; --studio-border-strong: #adadb8; --studio-text: #1a1a1d; --studio-text-muted: #53535a; --studio-text-heading: #0e0e10; --studio-accent: #9147ff; --studio-accent-hover: #772ce8; --studio-accent-bg: rgba(145,71,255,0.12); }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; background: var(--studio-bg); color: var(--studio-text); display: flex; flex-direction: column; }
        a { color: inherit; text-decoration: none; }
        .studio-header { height: 56px; border-bottom: 1px solid var(--studio-border); display: flex; align-items: center; padding: 0 20px; background: var(--studio-bg); }
        .studio-header .menu-btn { width: 40px; height: 40px; border: none; background: none; color: var(--studio-text-muted); cursor: pointer; font-size: 1.25rem; border-radius: 6px; }
        .studio-header .logo { font-weight: 700; font-size: 1.2rem; margin-left: 12px; color: var(--studio-text-heading); }
        .studio-header .logo span { color: var(--studio-accent); }
        .studio-header .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .studio-header .btn-create { padding: 8px 16px; background: var(--studio-accent); color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
        .studio-header .icon-btn, .studio-header .theme-toggle { width: 40px; height: 40px; border: none; background: none; color: var(--studio-text-muted); cursor: pointer; border-radius: 6px; font-size: 1.1rem; }
        .studio-header .theme-toggle .icon-sun { display: none; } .studio-header .theme-toggle .icon-moon { display: inline; }
        body.theme-light .studio-header .theme-toggle .icon-sun { display: inline; } body.theme-light .studio-header .theme-toggle .icon-moon { display: none; }
        .studio-header .profile-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--studio-bg-card); border: none; color: var(--studio-text-dim); }
        .studio-body { display: flex; flex: 1; min-height: 0; }
        .studio-sidebar { width: 240px; min-width: 240px; flex-shrink: 0; padding: 16px 0; border-right: 1px solid var(--studio-border); background: var(--studio-bg); overflow-y: auto; }
        .studio-sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 0.9rem; color: var(--studio-text-muted); border: none; background: none; width: 100%; text-align: left; font-family: inherit; border-radius: 0 6px 6px 0; margin: 0 12px 0 0; cursor: pointer; }
        .studio-sidebar .nav-item:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-sidebar .nav-item.active { color: var(--studio-accent); background: var(--studio-accent-bg); font-weight: 600; }
        .studio-sidebar .nav-item .nav-icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; line-height: 1; }
        .studio-sidebar .nav-item .nav-arrow { margin-left: auto; font-size: 0.7rem; transition: transform 0.2s; }
        .studio-sidebar .nav-group.open .nav-item.nav-trigger .nav-arrow { transform: rotate(180deg); }
        .studio-sidebar .nav-sub { display: none; list-style: none; margin: 0; padding: 0 0 4px 0; }
        .studio-sidebar .nav-group.open .nav-sub { display: block; }
        .studio-sidebar .nav-sub a { display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 48px; font-size: 0.85rem; color: var(--studio-text-muted); border-radius: 0 6px 6px 0; margin: 0 12px 0 0; }
        .studio-sidebar .nav-sub a:hover { color: var(--studio-text-heading); background: var(--studio-bg-hover); }
        .studio-sidebar .nav-divider { height: 1px; background: var(--studio-border); margin: 12px 20px; }
        .studio-sidebar .nav-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--studio-text-dim); padding: 16px 20px 6px; }
        .studio-sidebar .nav-item-hint { font-size: 0.75rem; color: var(--studio-text-dim); margin-left: auto; }
        .studio-main { flex: 1; padding: 28px 32px; overflow-y: auto; min-width: 0; }
        .page-title { font-size: 1.35rem; font-weight: 700; color: var(--studio-text-heading); margin: 0 0 20px 0; }
        .viewers-card { background: var(--studio-bg-elevated); border: 1px solid var(--studio-border); border-radius: 12px; padding: 24px; }
        .viewers-card .summary { font-size: 1rem; color: var(--studio-text); margin-bottom: 16px; }
        .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .filter-row input { flex: 1; min-width: 180px; padding: 10px 14px; border: 1px solid var(--studio-border-strong); border-radius: 8px; background: var(--studio-bg-card); color: var(--studio-text); font-size: 0.9rem; }
        .filter-row select { padding: 10px 14px; border: 1px solid var(--studio-border-strong); border-radius: 8px; background: var(--studio-bg-card); color: var(--studio-text); font-size: 0.9rem; }
        .filter-row .btn-search { padding: 10px 20px; background: var(--studio-accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--studio-border); font-size: 0.9rem; }
        .data-table th { background: var(--studio-bg-card); color: var(--studio-text-muted); font-weight: 600; }
        .data-table .empty-msg { text-align: center; padding: 48px 20px; color: var(--studio-text-muted); }
        @media (max-width: 768px) { .studio-sidebar { display: none; } }
    </style>
</head>
<body>
    <header class="studio-header">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="메뉴"><svg class="icon-menu" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a href="/streams.html" class="logo">GameMatcher <span>스튜디오</span></a>
        <div class="header-right">
            <a href="/studio-live.html" class="btn-create">+ 만들기</a>
            <button type="button" class="icon-btn" title="도움말" onclick="alert('도움말은 준비 중입니다.');"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
            <a href="/studio-alerts.html" class="icon-btn" title="알림"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
            <button type="button" class="theme-toggle" id="theme-toggle" title="다크/라이트 모드 전환" aria-label="테마 전환">
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="/profile.html" class="profile-btn" title="프로필"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></a>
        </div>
    </header>
    <div class="studio-body">
        <aside class="studio-sidebar">
            <a href="/studio.html" class="nav-item"><span class="nav-icon">▣</span>대시보드</a>
            <div class="nav-group" data-group="broadcast">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">📹</span>방송 관리<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="/studio-live.html">방송하기</a></li>
                    <li><a href="/studio-settings.html">설정</a></li>
                    <li><a href="/studio-alerts.html">알림</a></li>
                    <li><a href="/studio-chat-settings.html">채팅 설정</a></li>
                </ul>
            </div>
            <div class="nav-group" data-group="analysis">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">📊</span>분석<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="/studio-analysis-live.html">라이브 분석</a></li>
                    <li><a href="/studio-analysis-video.html">동영상 분석</a></li>
                </ul>
            </div>
            <div class="nav-group open" data-group="viewers">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">👥</span>시청자 관리<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="/studio-viewers-followers.html">팔로워</a></li>
                    <li><a href="/studio-viewers-subscribers.html" class="active">구독자</a></li>
                    <li><a href="/studio-viewers-blocklist.html">활동 제한</a></li>
                </ul>
            </div>
            <div class="nav-group" data-group="content">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">📄</span>콘텐츠 관리<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="/streams.html">라이브 스트리밍</a></li>
                    <li><a href="#">동영상</a></li>
                    <li><a href="#">내가 만든 클립</a></li>
                    <li><a href="#">내 채널의 클립</a></li>
                </ul>
            </div>
            <div class="nav-group" data-group="revenue">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">💰</span>수익 관리<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub"><li><a href="/studio-revenue.html">수익 창출</a></li></ul>
            </div>
            <div class="nav-group" data-group="channel">
                <button type="button" class="nav-item nav-trigger"><span class="nav-icon">🔗</span>채널/권한 관리<span class="nav-arrow">▼</span></button>
                <ul class="nav-sub">
                    <li><a href="#" class="ext">채널 관리</a></li>
                    <li><a href="#">권한 관리</a></li>
                </ul>
            </div>
            <div class="nav-divider"></div>
            <a href="/profile.html" class="nav-item"><span class="nav-icon">👤</span>내 정보</a>
            <a href="#" class="nav-item"><span class="nav-icon">📢</span>공지사항</a>
        </aside>
        <main class="studio-main">
            <h1 class="page-title">구독자</h1>
            <div class="viewers-card">
                <div class="summary" id="subscribers-summary">내 채널 구독자 / 0</div>
                <div class="filter-row">
                    <input type="text" id="subscribers-search" placeholder="닉네임을 입력해 주세요">
                    <button type="button" class="btn-search" id="subscribers-search-btn">검색</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr><th>닉네임</th><th>구독 시작일</th><th>기간</th><th>액션</th></tr>
                    </thead>
                    <tbody id="subscribers-tbody">
                        <tr><td colspan="4" class="empty-msg">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        fetch('/api/auth/ping', { credentials: 'include' }).catch(function () {});
        (function(){
            var THEME_KEY='studio-theme';
            function applyTheme(light){ document.body.classList.toggle('theme-light',!!light); if(light) localStorage.setItem(THEME_KEY,'light'); else localStorage.removeItem(THEME_KEY); }
            applyTheme(localStorage.getItem(THEME_KEY)==='light');
            document.getElementById('theme-toggle').onclick=function(){ applyTheme(!document.body.classList.contains('theme-light')); };
            document.querySelectorAll('.nav-group .nav-trigger').forEach(function(b){ b.onclick=function(){ this.closest('.nav-group').classList.toggle('open'); }; });
            document.getElementById('menu-btn').onclick=function(){ var s=document.querySelector('.studio-sidebar'); s.style.display=s.style.display==='none'?'block':'none'; };

            var subscriberList = [];
            function formatDate(s) {
                if (!s) return '-';
                try {
                    var d = new Date(s);
                    return isNaN(d.getTime()) ? s : d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
                } catch(e) { return s; }
            }
            function daysSince(s) {
                if (!s) return '-';
                try {
                    var d = new Date(s);
                    if (isNaN(d.getTime())) return '-';
                    var days = Math.floor((Date.now() - d.getTime()) / (24*60*60*1000));
                    if (days < 1) return '오늘';
                    if (days === 1) return '1일';
                    if (days < 30) return days + '일';
                    if (days < 365) return Math.floor(days/30) + '개월';
                    return Math.floor(days/365) + '년';
                } catch(e) { return '-'; }
            }
            function escapeHtml(s) {
                if (!s) return '';
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }
            function renderSubscribers(filterNickname) {
                var tbody = document.getElementById('subscribers-tbody');
                var summary = document.getElementById('subscribers-summary');
                summary.textContent = '내 채널 구독자 / ' + subscriberList.length;
                var list = subscriberList;
                if (filterNickname && filterNickname.trim()) {
                    var q = filterNickname.trim().toLowerCase();
                    list = subscriberList.filter(function(s){ return (s.nickname && s.nickname.toLowerCase().indexOf(q) !== -1) || (s.loginId && s.loginId.toLowerCase().indexOf(q) !== -1); });
                }
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">' + (filterNickname && filterNickname.trim() ? '검색 결과가 없습니다.' : '아직은 고요합니다.') + '</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(function(s) {
                    return '<tr><td>' + (s.nickname ? escapeHtml(s.nickname) : '-') + (s.loginId ? ' <span style="color:var(--studio-text-dim); font-size:0.85rem;">(' + escapeHtml(s.loginId) + ')</span>' : '') + '</td><td>' + formatDate(s.subscribedAt) + '</td><td>' + daysSince(s.subscribedAt) + '</td><td>-</td></tr>';
                }).join('');
            }
            function loadSubscribers() {
                fetch('/api/subscription/subscribers', { credentials: 'include' })
                    .then(function(r) {
                        if (r.status === 401) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return { list: [] }; }
                        return r.json();
                    })
                    .then(function(data) {
                        subscriberList = data.list || [];
                        renderSubscribers(document.getElementById('subscribers-search').value);
                    })
                    .catch(function() {
                        document.getElementById('subscribers-tbody').innerHTML = '<tr><td colspan="4" class="empty-msg">목록을 불러오지 못했습니다.</td></tr>';
                    });
            }
            document.getElementById('subscribers-search-btn').onclick = function() { renderSubscribers(document.getElementById('subscribers-search').value); };
            document.getElementById('subscribers-search').onkeydown = function(e) { if (e.key === 'Enter') renderSubscribers(this.value); };
            loadSubscribers();
        })();
    </script>
</body>
</html>
