<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방송 일정 관리 - GameMatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/typography-glitch.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #18181b; color: #efeff1; min-height: 100vh; padding: 24px; }
        a { color: #a970ff; }
        h1 { font-size: 1.5rem; margin: 0 0 20px 0; }
        .toolbar { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .toolbar a { color: #adadb8; }
        .toolbar a:hover { color: #fff; }
        .notice { padding: 12px; background: #26262c; border-radius: 8px; color: #adadb8; margin-bottom: 20px; font-size: 0.9rem; }
        .form-box { background: #1f1f23; border-radius: 8px; padding: 20px; margin-bottom: 20px; max-width: 480px; }
        .form-box h2 { font-size: 1.1rem; margin: 0 0 16px 0; }
        .form-box label { display: block; font-size: 0.85rem; color: #adadb8; margin-bottom: 4px; }
        .form-box input { width: 100%; padding: 10px 12px; border: 1px solid #3a3a3d; border-radius: 6px; background: #26262c; color: #efeff1; font-size: 0.95rem; margin-bottom: 12px; }
        .form-box input:focus { outline: none; border-color: #53535a; }
        .form-box .row { display: flex; gap: 12px; margin-top: 12px; }
        .form-box button { padding: 10px 20px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; border: none; }
        .form-box .btn-submit { background: #00e676; color: #0d0d0f; font-weight: 600; }
        .form-box .btn-submit:hover { background: #00d26a; }
        .form-box .btn-cancel { background: #3a3a3d; color: #efeff1; }
        .form-box .btn-cancel:hover { background: #53535a; }
        table { width: 100%; max-width: 640px; border-collapse: collapse; background: #1f1f23; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #26262c; }
        th { background: #26262c; color: #adadb8; font-size: 0.8rem; font-weight: 600; }
        td { font-size: 0.95rem; }
        tr:last-child td { border-bottom: none; }
        .btn-edit, .btn-delete { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; margin-right: 6px; }
        .btn-edit { background: #3a3a3d; color: #efeff1; }
        .btn-edit:hover { background: #53535a; }
        .btn-delete { background: rgba(233,25,22,0.2); color: #e91916; }
        .btn-delete:hover { background: rgba(233,25,22,0.3); }
        .error { color: #e91916; font-size: 0.9rem; margin-top: 8px; }
        .empty { color: #6b6b70; padding: 24px; }
    </style>
</head>
<body>
    <h1>다가오는 방송 일정 관리</h1>
    <div class="toolbar">
        <a href="/streams.html">← 전체 방송</a>
        <a href="/watch.html">시청 페이지</a>
    </div>
    <div id="operator-notice" class="notice" style="display:none;">일정 추가·수정·삭제는 운영자 계정(asd8219)으로 로그인한 경우에만 가능합니다.</div>
    <div id="login-notice" class="notice" style="display:none;">로그인 후 이용해 주세요. <a href="/streams.html">메인으로</a></div>

    <div id="form-section" style="display:none;">
        <div class="form-box">
            <h2 id="form-title">일정 추가</h2>
            <input type="hidden" id="edit-id" value="">
            <label>제목</label>
            <input type="text" id="schedule-title" placeholder="예: 주요 라이브">
            <label>일시 (예: 2025-03-10 12:40)</label>
            <input type="text" id="schedule-at" placeholder="2025-03-10 12:40">
            <label>링크 (선택)</label>
            <input type="text" id="schedule-link" placeholder="/streams.html">
            <p id="form-error" class="error"></p>
            <div class="row">
                <button type="button" class="btn-submit" id="btn-save">저장</button>
                <button type="button" class="btn-cancel" id="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <table id="schedule-table">
        <thead><tr><th>제목</th><th>일시</th><th>링크</th><th></th></tr></thead>
        <tbody id="schedule-tbody"></tbody>
    </table>
    <p id="schedule-empty" class="empty" style="display:none;">등록된 방송 일정이 없습니다.</p>

    <script src="/js/error-messages-ko.js"></script>
    <script>
        (function () {
            var OPERATOR_LOGIN_ID = 'asd8219';
            var tbody = document.getElementById('schedule-tbody');
            var formSection = document.getElementById('form-section');
            var formTitle = document.getElementById('form-title');
            var editId = document.getElementById('edit-id');
            var scheduleTitle = document.getElementById('schedule-title');
            var scheduleAt = document.getElementById('schedule-at');
            var scheduleLink = document.getElementById('schedule-link');
            var formError = document.getElementById('form-error');
            var operatorNotice = document.getElementById('operator-notice');
            var loginNotice = document.getElementById('login-notice');
            var scheduleEmpty = document.getElementById('schedule-empty');
            var isOperator = false;

            function loadSchedules() {
                fetch('/api/schedule', { credentials: 'include' })
                    .then(function (r) { return r.ok ? r.json() : []; })
                    .then(function (list) {
                        tbody.innerHTML = '';
                        scheduleEmpty.style.display = list.length ? 'none' : 'block';
                        (list || []).forEach(function (item) {
                            var tr = document.createElement('tr');
                            var at = (item.scheduleAt || '').replace('T', ' ').substring(0, 16);
                            tr.innerHTML = '<td>' + (item.title || '') + '</td><td>' + at + '</td><td>' + (item.link || '-') + '</td><td>' +
                                (isOperator ? '<button type="button" class="btn-edit" data-id="' + item.id + '">수정</button><button type="button" class="btn-delete" data-id="' + item.id + '">삭제</button>' : '') + '</td>';
                            tbody.appendChild(tr);
                        });
                        if (isOperator) {
                            tbody.querySelectorAll('.btn-edit').forEach(function (btn) {
                                btn.addEventListener('click', function () { startEdit(btn.dataset.id); });
                            });
                            tbody.querySelectorAll('.btn-delete').forEach(function (btn) {
                                btn.addEventListener('click', function () { doDelete(btn.dataset.id); });
                            });
                        }
                    })
                    .catch(function () { tbody.innerHTML = ''; scheduleEmpty.style.display = 'block'; });
            }

            function startEdit(id) {
                fetch('/api/schedule', { credentials: 'include' })
                    .then(function (r) { return r.json(); })
                    .then(function (list) {
                        var item = (list || []).find(function (x) { return String(x.id) === String(id); });
                        if (!item) return;
                        editId.value = item.id;
                        formTitle.textContent = '일정 수정';
                        scheduleTitle.value = item.title || '';
                        scheduleAt.value = (item.scheduleAt || '').replace('T', ' ').substring(0, 16);
                        scheduleLink.value = item.link || '';
                        formError.textContent = '';
                        formSection.style.display = 'block';
                    });
            }

            function doDelete(id) {
                if (!confirm('이 일정을 삭제할까요?')) return;
                fetch('/api/schedule/' + id, { method: 'DELETE', credentials: 'include' })
                    .then(function (r) {
                        if (r.ok) loadSchedules();
                        else return r.json().then(function (d) { alert(window.toKoreanErrorMessage(d && d.message) || '삭제 실패'); });
                    })
                    .catch(function () { alert('삭제 요청이 실패했습니다.'); });
            }

            function toApiDatetime(v) {
                if (!v || !v.trim()) return null;
                return v.trim().replace(' ', 'T').substring(0, 16);
            }

            document.getElementById('btn-save').addEventListener('click', function () {
                var id = editId.value.trim();
                var title = scheduleTitle.value.trim();
                var at = toApiDatetime(scheduleAt.value);
                var link = scheduleLink.value.trim();
                formError.textContent = '';
                if (!title) { formError.textContent = '제목을 입력해 주세요.'; return; }
                if (!at) { formError.textContent = '일시를 입력해 주세요. (예: 2025-03-10 12:40)'; return; }
                var url = id ? ('/api/schedule/' + id) : '/api/schedule';
                var method = id ? 'PUT' : 'POST';
                var body = JSON.stringify({ title: title, scheduleAt: at, link: link || null });
                fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: body })
                    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; }).catch(function () { return { ok: r.ok, status: r.status, data: {} }; }); })
                    .then(function (res) {
                        if (res.ok) {
                            editId.value = '';
                            formTitle.textContent = '일정 추가';
                            scheduleTitle.value = '';
                            scheduleAt.value = '';
                            scheduleLink.value = '';
                            formSection.style.display = 'none';
                            loadSchedules();
                        } else {
                            formError.textContent = (window.toKoreanErrorMessage(res.data && res.data.message) || '저장에 실패했습니다.');
                        }
                    })
                    .catch(function () { formError.textContent = '요청이 실패했습니다.'; });
            });

            document.getElementById('btn-cancel').addEventListener('click', function () {
                editId.value = '';
                formTitle.textContent = '일정 추가';
                scheduleTitle.value = '';
                scheduleAt.value = '';
                scheduleLink.value = '';
                formError.textContent = '';
                formSection.style.display = 'none';
            });

            fetch('/api/auth/me', { credentials: 'include' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (user) {
                    if (!user) {
                        loginNotice.style.display = 'block';
                        loadSchedules();
                        return;
                    }
                    isOperator = user.loginId === OPERATOR_LOGIN_ID;
                    if (isOperator) {
                        formSection.style.display = 'block';
                        formSection.querySelector('.form-box h2').textContent = '일정 추가';
                    } else {
                        operatorNotice.style.display = 'block';
                    }
                    loadSchedules();
                })
                .catch(function () {
                    loginNotice.style.display = 'block';
                    loadSchedules();
                });
        })();
    </script>
</body>
</html>
