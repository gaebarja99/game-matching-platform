<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 - GameMatcher 커뮤니티</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #0f0f12;
      color: #e4e4e7;
      min-height: 100vh;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 24px; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back { margin-bottom: 20px; font-size: 0.9rem; }
    .post-card {
      background: #18181b;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid #27272a;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .post-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
    .post-meta {
      display: flex;
      gap: 16px;
      font-size: 0.9rem;
      color: #71717a;
      flex-wrap: wrap;
    }
    .post-content {
      padding: 20px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .post-stats {
      display: flex;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid #27272a;
      font-size: 0.9rem;
      color: #71717a;
    }
    .hashtags { margin-top: 12px; }
    .hashtag { display: inline-block; margin-right: 8px; color: #a78bfa; font-size: 0.9rem; }
    .attachments { margin-top: 16px; }
    .attachments a {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
      padding: 6px 12px;
      background: #27272a;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #27272a; color: #e4e4e7; }
    .btn-secondary:hover { background: #3f3f46; }
    .comments-section {
      background: #18181b;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #27272a;
    }
    .comments-section h3 { margin-bottom: 20px; font-size: 1.1rem; }
    .comment-item {
      padding: 16px 0;
      border-bottom: 1px solid #27272a;
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .comment-author { color: #a78bfa; font-weight: 500; }
    .comment-date { color: #71717a; }
    .comment-content { color: #a1a1aa; font-size: 0.95rem; }
    .comment-reply { margin-left: 32px; margin-top: 12px; padding-left: 16px; border-left: 2px solid #3f3f46; }
    .comment-form {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-form textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px 16px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 1rem;
      resize: vertical;
    }
    .loading, .error { padding: 48px; text-align: center; color: #71717a; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← 목록으로</a>

    <div class="user-bar" style="margin-bottom:16px;padding:12px;background:#18181b;border-radius:8px;display:flex;align-items:center;gap:12px">
      <label style="color:#71717a">사용자 ID (좋아요/댓글용):</label>
      <input type="number" id="userId" value="1" min="1" style="width:80px;padding:8px;background:#27272a;border:1px solid #3f3f46;border-radius:6px;color:#e4e4e7">
    </div>

    <div id="post-area">
      <div class="loading">로딩 중...</div>
    </div>

    <div id="comments-area" style="display:none">
      <div class="comments-section">
        <h3>댓글 <span id="comment-count">0</span></h3>
        <div id="comment-list"></div>
        <div class="comment-form">
          <textarea id="commentContent" placeholder="댓글을 입력하세요..."></textarea>
          <button class="btn btn-primary" onclick="submitComment()">댓글 작성</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const savedUserId = localStorage.getItem('communityUserId');
    if (savedUserId) document.getElementById('userId').value = savedUserId;
    document.getElementById('userId').addEventListener('change', e => localStorage.setItem('communityUserId', e.target.value));

    const urlParams = new URLSearchParams(location.search);
    const postId = urlParams.get('id');
    if (!postId) {
      document.getElementById('post-area').innerHTML = '<div class="error">잘못된 접근입니다.</div>';
    } else {
      loadPost();
      loadComments();
    }

    async function loadPost() {
      try {
        const res = await fetch(`/api/community/posts/${postId}`);
        if (!res.ok) throw new Error('게시글을 불러올 수 없습니다: ' + res.status);
        const p = await res.json();

        const categoryNames = { FREE: '자유', NOTICE: '공지', QUESTION: '질문', LOL: '롤', VALORANT: '발로란트', PUBG: '배그' };
        document.getElementById('post-area').innerHTML = `
          <div class="post-card">
            <div class="post-header">
              <div>
                <div class="post-title">${escapeHtml(p.title)}</div>
                <div class="post-meta">
                  <span>${escapeHtml(p.authorUsername)}</span>
                  <span>${formatDate(p.createdAt)}</span>
                  <span>${categoryNames[p.boardCategory] || p.boardCategory}</span>
                </div>
              </div>
            </div>
            <div class="post-content">${escapeHtml(p.content)}</div>
            ${(p.hashtags || []).length ? `<div class="hashtags">${p.hashtags.map(h => `<span class="hashtag">#${escapeHtml(h)}</span>`).join('')}</div>` : ''}
            ${(p.attachments || []).length ? `<div class="attachments">첨부: ${p.attachments.map(a => `<a href="${a.filePath}" target="_blank">${escapeHtml(a.fileName)}</a>`).join('')}</div>` : ''}
            <div class="post-stats">
              <span>조회 ${p.viewCount}</span>
              <span>좋아요 ${p.likeCount}</span>
              <span>댓글 ${p.commentCount}</span>
              <span>추천 ${p.recommendCount} / 비추천 ${p.notRecommendCount}</span>
            </div>
            <div class="actions">
              <button class="btn btn-primary" onclick="toggleLike()">♥ 좋아요</button>
              <button class="btn btn-secondary" onclick="toggleBookmark()">북마크</button>
            </div>
          </div>
        `;
        document.getElementById('comments-area').style.display = 'block';
        document.getElementById('comment-count').textContent = p.commentCount;
      } catch (err) {
        document.getElementById('post-area').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      }
    }

    async function loadComments() {
      try {
        const res = await fetch(`/api/community/posts/${postId}/comments`);
        if (!res.ok) return;
        const comments = await res.json();
        const topLevel = comments.filter(c => !c.parentId);
        const withReplies = topLevel.map(c => ({
          ...c,
          replies: comments.filter(r => r.parentId === c.id)
        }));

        document.getElementById('comment-list').innerHTML = withReplies.length === 0
          ? '<div style="padding:24px;color:#71717a;text-align:center">댓글이 없습니다.</div>'
          : withReplies.map(c => `
              <div class="comment-item">
                <div class="comment-header">
                  <span class="comment-author">${escapeHtml(c.authorUsername)}</span>
                  <span class="comment-date">${formatDate(c.createdAt)}</span>
                </div>
                <div class="comment-content">${escapeHtml(c.content)}</div>
                ${(c.replies || []).map(r => `
                  <div class="comment-reply">
                    <div class="comment-header">
                      <span class="comment-author">${escapeHtml(r.authorUsername)}</span>
                      <span class="comment-date">${formatDate(r.createdAt)}</span>
                    </div>
                    <div class="comment-content">${escapeHtml(r.content)}</div>
                  </div>
                `).join('')}
              </div>
            `).join('');
      } catch (err) {
        document.getElementById('comment-list').innerHTML = '<div class="error">댓글을 불러올 수 없습니다.</div>';
      }
    }

    async function submitComment() {
      const userId = document.getElementById('userId').value;
      const content = document.getElementById('commentContent').value.trim();
      if (!content) { alert('댓글 내용을 입력하세요.'); return; }

      try {
        const res = await fetch(`/api/users/${userId}/community/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || '댓글 작성 실패');
        }
        document.getElementById('commentContent').value = '';
        loadPost();
        loadComments();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleLike() {
      const userId = document.getElementById('userId').value;
      try {
        await fetch(`/api/users/${userId}/community/posts/${postId}/like`, { method: 'POST' });
        loadPost();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleBookmark() {
      const userId = document.getElementById('userId').value;
      try {
        await fetch(`/api/users/${userId}/community/posts/${postId}/bookmark`, { method: 'POST' });
        alert('북마크가 적용되었습니다.');
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function formatDate(s) {
      if (!s) return '';
      return new Date(s).toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
