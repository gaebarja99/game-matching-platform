<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameMatcher 커뮤니티</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #0f0f12;
      color: #e4e4e7;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .user-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #18181b;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .user-bar label { color: #a1a1aa; }
    .user-bar input {
      width: 80px;
      padding: 6px 10px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e4e4e7;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 18px;
      background: #27272a;
      border: none;
      border-radius: 8px;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .tab:hover { background: #3f3f46; color: #e4e4e7; }
    .tab.active { background: #6366f1; color: white; }
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 1rem;
    }
    .search-bar input::placeholder { color: #71717a; }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #27272a; color: #e4e4e7; }
    .btn-secondary:hover { background: #3f3f46; }
    .post-list {
      background: #18181b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #27272a;
    }
    .post-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      cursor: pointer;
      transition: background 0.2s;
      align-items: center;
      text-decoration: none;
      color: inherit;
    }
    .post-item:last-child { border-bottom: none; }
    .post-item:hover { background: #27272a; }
    .post-title {
      font-weight: 500;
      color: #e4e4e7;
    }
    .post-meta {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #71717a;
      margin-top: 4px;
    }
    .post-meta span { display: flex; align-items: center; gap: 4px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      margin-left: 8px;
    }
    .badge-notice { background: #f59e0b; color: #0f0f12; }
    .badge-popular { background: #ec4899; color: white; }
    .stats { display: flex; gap: 12px; font-size: 0.85rem; color: #71717a; }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .pagination button {
      padding: 8px 14px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e4e4e7;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .pagination button:hover:not(:disabled) { background: #3f3f46; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty { text-align: center; padding: 48px; color: #71717a; }
    .loading { text-align: center; padding: 48px; color: #71717a; }
    .error { padding: 16px; background: #7f1d1d; color: #fca5a5; border-radius: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GameMatcher 커뮤니티</h1>

    <div class="user-bar">
      <label>테스트 사용자 ID:</label>
      <input type="number" id="userId" value="1" min="1">
      <a href="#" id="profileLink" style="margin-left:8px;color:#a78bfa">프로필 페이지</a>
      <span style="color:#71717a; font-size:0.85rem">(게시글 작성/댓글 등에 사용, DB users 테이블에 존재하는 ID 입력)</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-category="FREE">자유게시판</button>
      <button class="tab" data-category="NOTICE">공지사항</button>
      <button class="tab" data-category="QUESTION">질문게시판</button>
      <button class="tab" data-category="LOL">롤</button>
      <button class="tab" data-category="VALORANT">발로란트</button>
      <button class="tab" data-category="PUBG">배그</button>
    </div>

    <div class="search-bar">
      <input type="text" id="keyword" placeholder="검색어 입력...">
      <button class="btn btn-primary" onclick="loadPosts()">검색</button>
    </div>

    <div id="error" class="error" style="display:none"></div>

    <div id="content">
      <div class="loading">로딩 중...</div>
    </div>

    <div class="pagination" id="pagination" style="display:none"></div>

    <div style="margin-top: 24px;">
      <a href="write.html" class="btn btn-primary">글쓰기</a>
    </div>
  </div>

  <script>
    const categoryNames = {
      FREE: '자유게시판', NOTICE: '공지사항', QUESTION: '질문게시판',
      LOL: '롤', VALORANT: '발로란트', PUBG: '배그'
    };
    let currentCategory = 'FREE';
    let currentPage = 0;
    let totalPages = 0;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        currentPage = 0;
        loadPosts();
      });
    });

    document.getElementById('keyword').addEventListener('keypress', e => {
      if (e.key === 'Enter') loadPosts();
    });

    async function loadPosts() {
      const keyword = document.getElementById('keyword').value.trim();
      document.getElementById('error').style.display = 'none';
      document.getElementById('content').innerHTML = '<div class="loading">로딩 중...</div>';
      document.getElementById('pagination').style.display = 'none';

      try {
        const params = new URLSearchParams({ page: currentPage, size: 15, sortBy: 'latest' });
        if (keyword) params.set('keyword', keyword);
        const url = `/api/community/boards/${currentCategory}/posts?${params}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('목록을 불러올 수 없습니다: ' + res.status);
        const data = await res.json();

        totalPages = data.totalPages;
        const posts = data.content || [];

        if (posts.length === 0) {
          document.getElementById('content').innerHTML = '<div class="empty">게시글이 없습니다.</div>';
        } else {
          document.getElementById('content').innerHTML = `
            <div class="post-list">
              ${posts.map(p => `
                <a href="post.html?id=${p.id}" class="post-item">
                  <div>
                    <span class="post-title">${escapeHtml(p.title)}</span>
                    ${p.isNotice ? '<span class="badge badge-notice">공지</span>' : ''}
                    ${p.isPopular ? '<span class="badge badge-popular">인기</span>' : ''}
                    <div class="post-meta">
                      <span>${escapeHtml(p.authorUsername)}</span>
                      <span>${formatDate(p.createdAt)}</span>
                      ${(p.hashtags || []).length ? `<span>#${p.hashtags.join(' #')}</span>` : ''}
                    </div>
                  </div>
                  <div class="stats">
                    <span>조회 ${p.viewCount}</span>
                    <span>♥ ${p.likeCount}</span>
                    <span>💬 ${p.commentCount}</span>
                  </div>
                </a>
              `).join('')}
            </div>
          `;
        }

        // Pagination
        if (totalPages > 1) {
          document.getElementById('pagination').style.display = 'flex';
          document.getElementById('pagination').innerHTML = `
            <button onclick="goPage(0)" ${currentPage === 0 ? 'disabled' : ''}>처음</button>
            <button onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>이전</button>
            <span style="display:flex;align-items:center;padding:0 12px;color:#71717a">${currentPage + 1} / ${totalPages}</span>
            <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>다음</button>
            <button onclick="goPage(${totalPages - 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>마지막</button>
          `;
        }
      } catch (err) {
        document.getElementById('error').textContent = err.message;
        document.getElementById('error').style.display = 'block';
        document.getElementById('content').innerHTML = '<div class="empty">목록을 불러오는 중 오류가 발생했습니다.</div>';
      }
    }

    function goPage(page) {
      currentPage = Math.max(0, Math.min(page, totalPages - 1));
      loadPosts();
    }

    function escapeHtml(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function formatDate(s) {
      if (!s) return '';
      const d = new Date(s);
      return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function syncProfileLink() {
      const uid = document.getElementById('userId').value || '1';
      document.getElementById('profileLink').href = '/profile/profile.html?userId=' + encodeURIComponent(uid);
    }

    const savedUserId = localStorage.getItem('communityUserId');
    if (savedUserId) document.getElementById('userId').value = savedUserId;
    document.getElementById('userId').addEventListener('input', e => {
      localStorage.setItem('communityUserId', e.target.value);
      syncProfileLink();
    });
    syncProfileLink();

    loadPosts();
  </script>
</body>
</html>
