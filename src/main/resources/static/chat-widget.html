<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 - GameMatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="/js/alert-popup.js"></script>
    <script src="/js/error-messages-ko.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #18181b; color: #efeff1; }
        .cw-header { padding: 10px 16px; border-bottom: 1px solid #26262c; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .cw-header.cw-header-hidden { display: none !important; }
        .cw-header a { color: #00e676; text-decoration: none; font-size: 0.9rem; }
        .cw-header .title { flex: 1; font-weight: 600; font-size: 1rem; }
        .cw-notice { padding: 10px 16px; background: #1e1e21; border-bottom: 1px solid #26262c; font-size: 0.9rem; color: #b0b0b5; display: none; }
        .cw-notice.show { display: block; }
        .cw-frozen-msg { padding: 8px 16px; background: rgba(233,25,22,0.15); border-top: 1px solid #26262c; font-size: 0.85rem; color: #e91916; display: none; flex-shrink: 0; }
        .cw-frozen-msg.show { display: block; }
        .cw-host-toolbar { padding: 8px 16px; border-bottom: 1px solid #26262c; display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
        .cw-host-toolbar.show { display: flex; }
        .cw-host-toolbar button { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #3a3a3d; background: #26262c; color: #efeff1; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .cw-host-toolbar button:hover { background: #3a3a3d; }
        .cw-host-toolbar button.btn-freeze.on { background: rgba(233,25,22,0.2); border-color: #e91916; color: #e91916; }
        .cw-host-toolbar button.btn-notice { border-color: #00e676; color: #00e676; }
        .cw-messages { flex: 1; overflow-y: auto; padding: 12px; font-size: 1.1rem; line-height: 1.5; }
        .cw-messages .chat-msg { margin-bottom: 0.6rem; word-break: break-word; line-height: 1.5; }
        .cw-messages .chat-msg .user { margin-right: 0.4rem; font-weight: 600; color: #60a5fa; font-size: 1.05rem; }
        .cw-messages .chat-msg .chat-badges { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; vertical-align: middle; }
        .cw-messages .chat-msg .chat-badge { font-size: 0.85rem; line-height: 1; }
        .cw-messages .chat-msg .chat-badge-sub { font-size: 0.65rem; font-weight: 700; color: #fff; background: #00e676; padding: 0.1rem 0.35rem; border-radius: 4px; }
        .cw-messages .chat-msg .chat-badge-level { font-size: 0.7rem; font-weight: 700; color: #00e676; background: rgba(0,230,118,0.15); padding: 0.1rem 0.35rem; border-radius: 4px; }
        .cw-messages .chat-msg .chat-badge.donor-heart { color: #e91916; }
        .cw-messages .chat-msg.chat-msg-streamer .user { color: #e91916; }
        .cw-messages .chat-msg.chat-msg-rank1 .user { color: #fbbf24; }
        .cw-messages .chat-msg.chat-msg-rank2 .user { color: #9ca3af; }
        .cw-messages .chat-msg.chat-msg-rank3 .user { color: #d97706; }
        .cw-messages .chat-msg.chat-msg-donor .user { color: #a78bfa; }
        .cw-messages .chat-msg .streamer-badge { font-size: 0.8rem; font-weight: 700; color: #fff; background: #e91916; padding: 0.15rem 0.4rem; border-radius: 4px; margin-right: 0.35rem; }
        .cw-messages .chat-msg .partner-badge { font-size: 0.85rem; font-weight: 700; color: #00e676; margin-right: 0.25rem; }
        .cw-messages .chat-msg.pang-effect { font-weight: 700; color: #ffd700; font-size: 1.05rem; }
        .cw-messages .chat-msg.pang-effect .user { color: #ffd700; }
        .cw-messages .chat-msg .chat-consecutive-days { font-size: 0.85rem; color: #fef08a; margin-left: 0.35rem; font-weight: 600; }
        /* 후원 카드 - watch.html과 동일 */
        .cw-messages .chat-msg-donation-card { margin: 8px 0; display: block; }
        .cw-messages .chat-msg-donation-card { max-width: 100%; min-width: 0; }
        .cw-messages .chat-msg-donation-card .twitch-alert { background: #18181b; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.35); border-left: 3px solid #9147ff; font-size: 13px; max-width: 100%; min-width: 0; width: 100%; box-sizing: border-box; }
        .cw-messages .chat-msg-donation-card .twitch-alert-body { min-width: 0; overflow: hidden; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor { flex-wrap: wrap; min-width: 0; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor .pang-emoji-img { max-width: 20px; height: auto; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor .donation-label-img { max-width: 80px; }
        .cw-messages .chat-msg-donation-card .twitch-alert.tier-mega { border-left-color: #ff6b9d; }
        .cw-messages .chat-msg-donation-card .twitch-alert.tier-super { border-left-color: #00e676; }
        .cw-messages .chat-msg-donation-card .twitch-alert-header { background: linear-gradient(90deg, #9147ff 0%, #772ce8 100%); padding: 0.35em 0.7em; font-size: 0.65rem; font-weight: 800; color: #fff; }
        .cw-messages .chat-msg-donation-card .twitch-alert.tier-mega .twitch-alert-header { background: linear-gradient(90deg, #ff6b9d 0%, #e8488a 100%); }
        .cw-messages .chat-msg-donation-card .twitch-alert.tier-super .twitch-alert-header { background: linear-gradient(90deg, #00e676 0%, #00a858 100%); color: #fff; }
        .cw-messages .chat-msg-donation-card .twitch-alert-body { padding: 0.6em 0.75em; color: #efeff1; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor { font-size: 0.9rem; font-weight: 700; color: #fff; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor .twitch-name { color: #a970ff; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor .donation-label-img { height: 1.35em; max-height: 22px; width: auto; object-fit: contain; vertical-align: middle; margin: 0 2px; }
        .cw-messages .chat-msg-donation-card .twitch-alert-donor .pang-emoji-img { height: 1em; width: auto; vertical-align: middle; margin: 0 1px; }
        .cw-messages .chat-msg-donation-card .twitch-alert-msg { margin-top: 0.4em; padding: 0.4em 0.55em; background: rgba(255,255,255,0.06); border-radius: 4px; font-size: 0.82rem; color: #e0e0e0; word-break: break-word; }
        .cw-messages .chat-msg-donation-card .twitch-alert-consecutive { font-size: 0.85rem; font-weight: 700; color: #fef08a; margin-top: 4px; }
        .cw-messages .chat-msg .user-id { font-size: 0.85rem; font-weight: 500; color: #6b6b70; margin-left: 0.25rem; }
        .cw-messages .chat-msg.chat-msg-system { font-size: 0.9rem; padding: 0.4rem 0; }
        .cw-messages .chat-msg.chat-msg-system .user { color: #adadb8; }
        .cw-input-wrap { padding: 12px; border-top: 1px solid #26262c; flex-shrink: 0; }
        .cw-input-wrap input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 2px solid #3a3a3d; background: #26262c; color: #efeff1; font-size: 1.05rem; box-sizing: border-box; }
        .cw-input-wrap input:focus { outline: none; border-color: #00e676; }
        .cw-input-wrap input:disabled { opacity: 0.6; cursor: not-allowed; }
        .cw-login-msg { padding: 12px; font-size: 0.9rem; color: #8b8b90; }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-backdrop.show { display: flex; }
        .modal-box { background: #1e1e21; border: 1px solid #2c2c2e; border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; transition: background 0.2s, border-color 0.2s, color 0.2s; }
        body.theme-light .modal-box { background: #fff; border-color: #e5e5e7; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .modal-box h2 { margin: 0 0 16px 0; font-size: 1.1rem; color: #efeff1; }
        body.theme-light .modal-box h2 { color: #1a1a1d; }
        .modal-box textarea { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #3a3a3d; background: #26262c; color: #efeff1; font-size: 0.95rem; resize: vertical; min-height: 80px; box-sizing: border-box; }
        body.theme-light .modal-box textarea { border-color: #e0e0e2; background: #f5f5f7; color: #1a1a1d; }
        .modal-box .char-count { font-size: 0.8rem; color: #6b6b70; margin-top: 4px; text-align: right; }
        .modal-box .toggle-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .modal-box .toggle-row label { flex: 1; color: #efeff1; }
        body.theme-light .modal-box .toggle-row label { color: #1a1a1d; }
        .modal-box .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
        .modal-box .btn-apply { flex: 1; padding: 10px; background: #00e676; color: #0d0d0f; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .modal-box .btn-cancel { padding: 10px 16px; background: #26262c; color: #b0b0b5; border: 1px solid #3a3a3d; border-radius: 8px; cursor: pointer; }
        body.theme-light .modal-box .btn-cancel { background: #f5f5f7; color: #53535a; border-color: #e0e0e2; }
        body.theme-light .modal-box .btn-cancel:hover { background: #e5e5e7; color: #1a1a1d; }
        .modal-box .ban-list { max-height: 200px; overflow-y: auto; margin: 12px 0; }
        .modal-box .ban-list .ban-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2c2c2e; }
        body.theme-light .modal-box .ban-list .ban-item { border-bottom-color: #e5e5e7; }
        .modal-box .ban-list .ban-item button { padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; border: 1px solid #e91916; background: transparent; color: #e91916; cursor: pointer; }
        .modal-box .add-ban-row { display: flex; gap: 8px; margin-top: 12px; }
        .modal-box .add-ban-row input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 2px solid #3a3a3d; background: #26262c; color: #efeff1; }
        body.theme-light .modal-box .add-ban-row input { border-color: #e0e0e2; background: #f5f5f7; color: #1a1a1d; }

        /* 방송 오버레이 모드: ?overlay=1 — 헤더/로그인/입력란 숨김, 가로 여백 축소, 글자 확대, 가로·세로 리사이즈 */
        body.overlay-mode { background: transparent; padding: 0; margin: 0; align-items: flex-start; justify-content: flex-start; }
        body.overlay-mode .cw-header,
        body.overlay-mode .cw-login-msg,
        body.overlay-mode .cw-input-wrap,
        body.overlay-mode .cw-host-toolbar { display: none !important; }
        body.overlay-mode .overlay-resize-wrap {
            resize: both;
            overflow: hidden;
            min-width: 220px;
            min-height: 180px;
            max-width: 100vw;
            max-height: 100vh;
            width: 320px;
            height: 280px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        body.overlay-mode .overlay-resize-wrap .cw-messages {
            flex: 1;
            min-height: 0;
            min-width: 0;
            width: 100%;
        }
        body.overlay-mode .cw-messages .chat-msg {
            max-width: 100%;
        }
        body.overlay-mode .cw-messages {
            -ms-overflow-style: none;
            scrollbar-width: none;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            text-shadow: 0 0 2px #000, 0 1px 4px rgba(0,0,0,0.9), 1px 1px 2px #000;
            padding: 6px 8px;
            font-size: 1.35rem;
            box-sizing: border-box;
        }
        body.overlay-mode .cw-messages .chat-msg { font-size: 1.35rem; margin-bottom: 0.5rem; }
        body.overlay-mode .cw-messages .chat-msg .user { font-size: 1.3rem; color: #c4b5fd; text-shadow: 0 0 2px #000, 0 1px 4px rgba(0,0,0,0.9); }
        body.overlay-mode .cw-messages .chat-msg.chat-msg-streamer .user { color: #fca5a5; }
        body.overlay-mode .cw-messages .chat-msg .partner-badge { color: #00e676; }
        body.overlay-mode .cw-messages .chat-msg.pang-effect { font-size: 1.4rem; }
        body.overlay-mode .cw-messages .chat-msg.pang-effect .user { color: #fef08a; }
        body.overlay-mode .cw-messages .chat-msg-donation-card .twitch-alert { font-size: 14px; }
        body.overlay-mode .cw-messages .chat-msg-donation-card .twitch-alert-donor { font-size: 1rem; }
        body.overlay-mode .cw-messages .chat-msg-donation-card .twitch-alert-donor .donation-label-img { max-height: 26px; }
        body.overlay-mode .cw-notice.show { background: rgba(0, 0, 0, 0.5); color: #e5e5e5; padding: 6px 8px; font-size: 1.1rem; }
        body.overlay-mode .cw-frozen-msg.show { background: rgba(233, 25, 22, 0.25); padding: 6px 8px; font-size: 1.1rem; }
        /* 채팅 오버레이: 스크롤바 숨김 (스크롤은 유지) */
        body.overlay-mode .cw-messages::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div class="cw-header cw-header-hidden" aria-hidden="true">
        <a href="/streams.html">← 목록</a>
        <span class="title" id="widget-stream-title">채팅</span>
    </div>
    <div class="cw-notice" id="widget-notice"></div>
    <div class="cw-host-toolbar" id="host-toolbar">
        <button type="button" class="btn-notice" id="btn-notice" title="BJ 공지">📢 공지</button>
        <button type="button" class="btn-freeze" id="btn-freeze">얼리기</button>
        <button type="button" id="btn-ban" title="채팅 금지">채팅금지</button>
        <button type="button" id="btn-blacklist" title="블랙리스트 (방송 입장 차단)">블랙리스트</button>
        <button type="button" id="btn-managers" title="매니저 지정/해제">매니저</button>
        <button type="button" id="btn-pang-limit" title="후원 팡 제한">후원</button>
    </div>
    <div class="cw-messages" id="chat-messages">
        <div class="chat-msg"><span class="user">시스템</span> 채팅창에 오신 것을 환영합니다.</div>
    </div>
    <div class="cw-login-msg" id="login-msg" style="display:none;">로그인 후 채팅을 이용할 수 있습니다.</div>
    <div class="cw-frozen-msg" id="widget-frozen-msg">채팅이 얼려졌습니다. 방장만 채팅할 수 있습니다.</div>
    <div class="cw-input-wrap">
        <input type="text" id="chat-input" placeholder="메시지를 입력해주세요" disabled maxlength="500">
    </div>

    <div id="modal-notice" class="modal-backdrop">
        <div class="modal-box">
            <h2>BJ 공지 등록</h2>
            <div class="toggle-row">
                <label>공지 노출</label>
                <input type="checkbox" id="notice-visible" checked>
            </div>
            <textarea id="notice-text" maxlength="200" placeholder="공지사항 등록 후 노출 처리 시 채팅창 상단에 등록됩니다."></textarea>
            <p class="char-count" id="notice-char-count">0/200</p>
            <div class="modal-actions">
                <button type="button" class="btn-apply" id="notice-apply">적용</button>
                <button type="button" class="btn-cancel" id="notice-cancel">취소</button>
            </div>
        </div>
    </div>
    <div id="modal-ban" class="modal-backdrop">
        <div class="modal-box">
            <h2>채팅 금지 사용자</h2>
            <div class="ban-list" id="ban-list"></div>
            <div class="add-ban-row">
                <input type="text" id="ban-user-id" placeholder="로그인 아이디 또는 사용자 ID (숫자)" autocomplete="off">
                <select id="ban-duration">
                    <option value="">영구</option>
                    <option value="5" selected>5분</option>
                    <option value="10">10분</option>
                    <option value="30">30분</option>
                </select>
                <button type="button" class="btn-apply" id="ban-add">추가</button>
            </div>
            <div class="modal-actions" style="margin-top:12px;">
                <button type="button" class="btn-cancel" id="ban-close">닫기</button>
            </div>
        </div>
    </div>
    <div id="modal-blacklist" class="modal-backdrop">
        <div class="modal-box">
            <h2>블랙리스트 (방송 입장 차단)</h2>
            <div class="ban-list" id="blacklist-list"></div>
            <div class="add-ban-row">
                <input type="text" id="blacklist-user-id" placeholder="로그인 아이디 또는 사용자 ID" autocomplete="off">
                <button type="button" class="btn-apply" id="blacklist-add">추가</button>
            </div>
            <div class="modal-actions" style="margin-top:12px;">
                <button type="button" class="btn-cancel" id="blacklist-close">닫기</button>
            </div>
        </div>
    </div>
    <div id="modal-managers" class="modal-backdrop">
        <div class="modal-box">
            <h2>매니저</h2>
            <div class="ban-list" id="managers-list"></div>
            <div class="add-ban-row">
                <input type="text" id="manager-user-id" placeholder="로그인 아이디 또는 사용자 ID" autocomplete="off">
                <button type="button" class="btn-apply" id="manager-add">매니저 지정</button>
            </div>
            <div class="modal-actions" style="margin-top:12px;">
                <button type="button" class="btn-cancel" id="managers-close">닫기</button>
            </div>
        </div>
    </div>
    <div id="modal-pang-limit" class="modal-backdrop">
        <div class="modal-box">
            <h2>후원 팡 제한</h2>
            <p class="hint" style="font-size:0.85rem; color:#8b8b90; margin-bottom:14px; line-height:1.4;">영상 후원 / TTS(후원 메시지)는 설정한 팡 이상일 때만 가능합니다. 0이면 제한 없음.</p>
            <div class="modal-field" style="margin-bottom:12px;">
                <label style="display:block; margin-bottom:6px;">영상 후원 최소 (팡)</label>
                <input type="number" id="donation-limit-video" min="0" value="0" style="width:100%; padding:8px 10px; border-radius:6px; border:2px solid #3a3a3d; background:#26262c; color:#efeff1; box-sizing:border-box;">
            </div>
            <div class="modal-field" style="margin-bottom:16px;">
                <label style="display:block; margin-bottom:6px;">TTS 최소 (팡)</label>
                <input type="number" id="donation-limit-tts" min="0" value="0" style="width:100%; padding:8px 10px; border-radius:6px; border:2px solid #3a3a3d; background:#26262c; color:#efeff1; box-sizing:border-box;">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-apply" id="btn-save-donation-limits">저장</button>
                <button type="button" class="btn-cancel" id="modal-pang-limit-close">닫기</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var streamId = params.get('streamId') || params.get('streamid');
            var isOverlay = params.get('overlay') === '1' || params.get('overlay') === 'true';
            if (isOverlay) {
                document.body.classList.add('overlay-mode');
                var wrap = document.createElement('div');
                wrap.className = 'overlay-resize-wrap';
                var notice = document.getElementById('widget-notice');
                var messages = document.getElementById('chat-messages');
                var frozen = document.getElementById('widget-frozen-msg');
                if (notice) wrap.appendChild(notice);
                if (messages) wrap.appendChild(messages);
                if (frozen) wrap.appendChild(frozen);
                document.body.appendChild(wrap);
            }
            function setOverlayStatus(text) { /* 제거됨: 오버레이에서는 상태 문구 미표시 */ }

            if (!streamId) {
                document.getElementById('chat-messages').innerHTML = '<div class="chat-msg"><span class="user">시스템</span> URL에 streamId가 필요합니다. 예: chat-widget.html?streamId=1</div>';
                return;
            }

            var streamData = { userId: null, title: '', chatFrozen: false, streamNotice: '', streamNoticeVisible: false, partner: false };
            var currentUserId = null;
            var isHost = false;

            function esc(s) {
                if (!s) return '';
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }
            var donorUserIds = new Set();
            var donorRank1Id = null, donorRank2Id = null, donorRank3Id = null;
            var subscriberUserIds = new Set();
            function appendChatMsg(displayName, text, isStreamer, userId, level) {
                var el = document.getElementById('chat-messages');
                if (!el) return;

            function showDonationOnScreen(data) {

            function pollNewMessages() {

                                    if (d && d.type === 'system' && d.text) {

                                            div.innerHTML = '<span class="user">시스템</span> ' + (function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; })(d.text);

                var btn = this;
                btn.disabled = true;
                fetch('/api/streams/' + streamId + '/chat-settings/donation-limits', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ minVideoPang: minVideo, minTtsPang: minTts })
                }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); }).then(function (res) {
                    if (res.ok) { alert('저장되었습니다.'); modalPangLimit.classList.remove('show'); }
                    else alert(window.toKoreanErrorMessage(res.data && res.data.message) || '저장에 실패했습니다.');
                }).catch(function () { alert('저장에 실패했습니다.'); }).finally(function () { btn.disabled = false; });
            });

            loadStreamAndSettings();
            loadChatHistory();
        })();
    </script>
</body>
</html>
