<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameMatcher Chat Widget</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: rgba(8, 10, 18, 0.88);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.78);
      --shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: transparent;
      color: var(--text);
    }

    body.overlay-off {
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.18), transparent 34%),
        linear-gradient(160deg, #09111f 0%, #111827 100%);
      padding: 16px;
    }

    .widget-shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .widget-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      border-radius: 18px;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    body.overlay-on .widget-card {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      backdrop-filter: none;
    }

    .widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px;
      font-size: 13px;
      color: var(--muted);
    }

    body.overlay-on .widget-head {
      display: none;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .message-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
      overflow: hidden;
    }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
    }

    body.overlay-on .message {
      background: rgba(15, 23, 42, 0.74);
    }

    .message.chat {
      border-left: 4px solid rgba(34, 197, 94, 0.85);
    }

    .message.donation {
      border-left: 4px solid rgba(245, 158, 11, 0.95);
    }

    .message.system {
      border-left: 4px solid rgba(96, 165, 250, 0.95);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      flex: 0 0 auto;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      min-width: 0;
      flex: 1;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .name {
      font-weight: 800;
      color: var(--text);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.streamer {
      color: #052e16;
      background: rgba(34, 197, 94, 0.92);
    }

    .badge.donation {
      color: #451a03;
      background: rgba(251, 191, 36, 0.92);
    }

    .badge.system {
      color: #082f49;
      background: rgba(96, 165, 250, 0.92);
    }

    .text {
      line-height: 1.45;
      font-size: 15px;
      font-weight: 700;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .subtext {
      margin-top: 6px;
      line-height: 1.4;
      font-size: 13px;
      color: var(--muted);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .empty {
      margin: auto 0;
      padding: 18px;
      text-align: center;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.76);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      color: var(--muted);
      font-size: 14px;
    }

    body.overlay-on .empty {
      background: rgba(15, 23, 42, 0.62);
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="widget-card">
      <div class="widget-head">
        <div class="widget-title">라이브 채팅 오버레이</div>
        <div id="status">대기 중</div>
      </div>
      <div id="message-list" class="message-list">
        <div class="empty">채팅을 기다리는 중입니다.</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const streamId = params.get("streamId");
      const overlay = params.get("overlay") === "1";
      const messageList = document.getElementById("message-list");
      const status = document.getElementById("status");

      document.body.classList.add(overlay ? "overlay-on" : "overlay-off");

      if (!streamId) {
        status.textContent = "오류";
        messageList.innerHTML = '<div class="empty">streamId가 없습니다.</div>';
        return;
      }

      const seenKeys = new Set();
      let latestTimestamp = 0;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function avatarMarkup(name, imageUrl) {
        if (imageUrl) {
          return '<div class="avatar"><img src="' + escapeHtml(imageUrl) + '" alt=""></div>';
        }
        const fallback = (name || "?").trim().slice(0, 1) || "?";
        return '<div class="avatar">' + escapeHtml(fallback) + "</div>";
      }

      function itemKey(item) {
        const base = item.type === "donation"
          ? [item.type, item.donorName, item.amount, item.donorMessage, item.timestamp]
          : [item.type || "chat", item.userId, item.displayName, item.text, item.timestamp];
        return base.join("|");
      }

      function renderMessage(item) {
        const isDonation = item.type === "donation";
        const isSystem = item.type === "system";
        const name = isDonation
          ? (item.donorName || "후원자")
          : (item.displayName || "SYSTEM");
        const imageUrl = isDonation ? item.donorProfileImageUrl : item.profileImageUrl;
        const typeClass = isDonation ? "donation" : (isSystem ? "system" : "chat");

        let badge = "";
        if (isDonation) {
          badge = '<span class="badge donation">후원</span>';
        } else if (isSystem) {
          badge = '<span class="badge system">시스템</span>';
        } else if (item.streamer) {
          badge = '<span class="badge streamer">스트리머</span>';
        }

        const mainText = isDonation
          ? ((item.amount || 0).toLocaleString() + "팡 후원")
          : (item.text || "");
        const subtext = isDonation ? (item.donorMessage || "") : "";

        const wrapper = document.createElement("div");
        wrapper.className = "message " + typeClass;
        wrapper.innerHTML =
          avatarMarkup(name, imageUrl) +
          '<div class="content">' +
            '<div class="meta"><span class="name">' + escapeHtml(name) + "</span>" + badge + "</div>" +
            '<div class="text">' + escapeHtml(mainText) + "</div>" +
            (subtext ? '<div class="subtext">' + escapeHtml(subtext) + "</div>" : "") +
          "</div>";

        const empty = messageList.querySelector(".empty");
        if (empty) {
          empty.remove();
        }
        messageList.appendChild(wrapper);

        while (messageList.children.length > 18) {
          messageList.removeChild(messageList.firstChild);
        }
      }

      async function loadTimeline() {
        try {
          const response = await fetch("/api/streams/" + encodeURIComponent(streamId) + "/chat-timeline?limit=30", {
            credentials: "include"
          });
          if (!response.ok) {
            throw new Error("timeline load failed");
          }

          const list = await response.json();
          const items = Array.isArray(list) ? list : [];
          let appended = false;

          for (const item of items) {
            const timestamp = Number(item.timestamp || Date.parse(item.createdAt || "") || 0);
            const normalized = { ...item, timestamp };
            const key = itemKey(normalized);
            if (timestamp && timestamp < latestTimestamp) {
              continue;
            }
            if (seenKeys.has(key)) {
              continue;
            }
            seenKeys.add(key);
            if (timestamp > latestTimestamp) {
              latestTimestamp = timestamp;
            }
            renderMessage(normalized);
            appended = true;
          }

          status.textContent = appended ? "연결 중" : "대기 중";
        } catch (error) {
          status.textContent = "연결 실패";
          if (!messageList.children.length) {
            messageList.innerHTML = '<div class="empty">채팅 연결에 실패했습니다.</div>';
          }
        }
      }

      loadTimeline();
      window.setInterval(loadTimeline, 1500);
    })();
  </script>
</body>
</html>
