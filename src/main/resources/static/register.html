<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - GameMatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/error-messages-ko.js"></script>
    <script type="module" src="/js/firebase-init.js"></script>
    <script type="module" src="/js/firebase-recaptcha.js"></script>
    <script type="module" src="/js/firebase-phone-auth.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }
        body.theme-dark { background: #0d0d0f; color: #f5f5f5; }
        body.theme-light { background: #f0f0f2; color: #1a1a1d; }
        a { color: inherit; text-decoration: none; }
        a:hover { color: #00e676; }

        .header { width: 100%; height: 56px; border-bottom: 1px solid; display: flex; align-items: center; padding: 0 16px 0 24px; position: sticky; top: 0; z-index: 100; transition: background 0.2s, border-color 0.2s; }
        body.theme-dark .header { background: #18181b; border-color: #2c2c2e; }
        body.theme-light .header { background: #fff; border-color: #e5e5e7; }
        .header-logo { font-weight: 700; font-size: 1.35rem; color: #00e676; margin-right: 20px; letter-spacing: -0.02em; }
        .header-logo:hover { color: #33eb91; }
        .header-nav { display: flex; gap: 12px 20px; }
        body.theme-dark .header-nav a { color: #b0b0b5; }
        body.theme-light .header-nav a { color: #53535a; }
        .header-nav a:hover { color: #00e676 !important; }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .btn-theme { width: 40px; height: 40px; border-radius: 8px; border: 1px solid; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        body.theme-dark .btn-theme { border-color: #3a3a3d; color: #b0b0b5; }
        body.theme-light .btn-theme { border-color: #d0d0d2; color: #53535a; }
        .btn-theme .icon-sun { display: none; }
        .btn-theme .icon-moon { display: none; }
        body.theme-dark .btn-theme .icon-sun { display: block; }
        body.theme-light .btn-theme .icon-moon { display: block; }
        .btn-theme .theme-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-login { padding: 0.5rem 1rem; background: transparent; border: 1px solid; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 500; text-decoration: none; }
        body.theme-dark .btn-login { color: #b0b0b5; border-color: #3a3a3d; }
        body.theme-dark .btn-login:hover { color: #fff; border-color: #53535a; }
        body.theme-light .btn-login { color: #53535a; border-color: #d0d0d2; }
        body.theme-light .btn-login:hover { color: #1a1a1d; border-color: #b0b0b5; }

        .register-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
        .register-card { width: 100%; max-width: 420px; border-radius: 12px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        body.theme-dark .register-card { background: #1e1e21; border: 1px solid #2c2c2e; }
        body.theme-light .register-card { background: #fff; border: 1px solid #e5e5e7; }
        .register-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; text-align: center; }
        body.theme-dark .register-title { color: #fff; }
        body.theme-light .register-title { color: #1a1a1d; }
        .register-field { margin-bottom: 16px; }
        .register-field label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
        body.theme-dark .register-field label { color: #b0b0b5; }
        body.theme-light .register-field label { color: #53535a; }
        .register-field input { width: 100%; height: 44px; border-radius: 8px; border: 1px solid; padding: 0 14px; font-size: 0.95rem; }
        body.theme-dark .register-field input { background: #2c2c2e; border-color: #3a3a3d; color: #fff; }
        body.theme-light .register-field input { background: #f5f5f7; border-color: #e0e0e2; color: #1a1a1d; }
        .register-field input:focus { outline: none; border-color: #00e676; }
        .register-field-row { display: flex; gap: 8px; align-items: center; }
        .register-field-row input { flex: 1; min-width: 0; }
        .btn-check { flex-shrink: 0; padding: 0 14px; height: 44px; border-radius: 8px; border: 1px solid #00e676; background: transparent; color: #00e676; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        .btn-check:hover { background: rgba(0,230,118,0.12); }
        .check-msg { font-size: 0.8rem; margin-top: 4px; }
        .check-msg.ok { color: #00e676; }
        .check-msg.fail { color: #f44336; }
        .register-actions { display: flex; gap: 10px; margin-top: 24px; }
        .register-actions .btn-primary { flex: 1; height: 44px; background: #00e676; color: #0d0d0f; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .register-actions .btn-primary:hover { background: #33eb91; }
        .register-actions .btn-secondary { height: 44px; padding: 0 20px; background: transparent; border: 1px solid; border-radius: 8px; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-flex; align-items: center; }
        body.theme-dark .register-actions .btn-secondary { border-color: #3a3a3d; color: #b0b0b5; }
        body.theme-light .register-actions .btn-secondary { border-color: #d0d0d2; color: #53535a; }
        .register-footer { margin-top: 20px; text-align: center; font-size: 0.9rem; }
        body.theme-dark .register-footer { color: #6b6b70; }
        body.theme-light .register-footer { color: #6b6b70; }
        .register-footer a { color: #00e676; font-weight: 500; }
        .register-error { font-size: 0.85rem; color: #f44336; margin-top: 8px; }
        #sign-in-button { position: absolute; left: -9999px; width: 100px; height: 60px; overflow: hidden; pointer-events: none; }
    </style>
</head>
<body class="theme-dark">
    <header class="header">
        <a href="/" class="header-logo">GameMatcher</a>
        <nav class="header-nav">
            <a href="/streams.html">전체 방송</a>
            <a href="/streams.html">게임</a>
        </nav>
        <div class="header-right">
            <button type="button" class="btn-theme" id="btn-theme" title="테마 전환" aria-label="테마 전환">
                <span class="theme-icon">
                    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
            </button>
            <a href="/index.html" class="btn-login">로그인</a>
        </div>
    </header>

    <main class="register-main">
        <div class="register-card">
            <h1 class="register-title">회원가입</h1>
            <div id="sign-in-button"></div>
            <form id="form-register">
                <div class="register-field">
                    <label for="main-reg-loginId">아이디</label>
                    <div class="register-field-row">
                        <input type="text" id="main-reg-loginId" required minlength="5" autocomplete="username">
                        <button type="button" class="btn-check" id="main-btn-check-loginId">중복확인</button>
                    </div>
                    <p class="check-msg" id="main-msg-loginId" aria-live="polite"></p>
                </div>
                <div class="register-field">
                    <label for="main-reg-password">비밀번호</label>
                    <input type="password" id="main-reg-password" required minlength="8" placeholder="8자 이상" autocomplete="new-password">
                </div>
                <div class="register-field">
                    <label for="main-reg-password2">비밀번호 확인</label>
                    <input type="password" id="main-reg-password2" required minlength="8" placeholder="비밀번호 재입력" autocomplete="new-password">
                    <p class="check-msg" id="main-msg-password2" aria-live="polite"></p>
                </div>
                <div class="register-field">
                    <label for="main-reg-username">이름</label>
                    <input type="text" id="main-reg-username" required autocomplete="name">
                </div>
                <div class="register-field">
                    <label for="main-reg-nickname">닉네임</label>
                    <input type="text" id="main-reg-nickname" placeholder="표시될 이름" autocomplete="nickname">
                </div>
                <div class="register-field">
                    <label for="main-reg-email">이메일</label>
                    <input type="email" id="main-reg-email" required placeholder="이메일" autocomplete="email">
                </div>
                <div class="register-field">
                    <label for="main-reg-phone">전화번호</label>
                    <div class="register-field-row" style="gap:8px;">
                        <span style="align-self:center;color:#9e9ea6;">+82</span>
                        <input type="tel" id="main-reg-phone" placeholder="010-0000-0000" style="flex:1;min-width:0;" autocomplete="tel">
                        <button type="button" class="btn-check" id="main-reg-phone-send">문자 인증</button>
                    </div>
                </div>
                <div class="register-field" id="main-reg-phone-code-wrap" style="display:none;">
                    <label for="main-reg-phone-code">인증 코드</label>
                    <div class="register-field-row" style="gap:8px;">
                        <input type="text" id="main-reg-phone-code" placeholder="SMS 6자리 코드" inputmode="numeric" maxlength="6" style="flex:1;min-width:0;">
                        <button type="button" class="btn-check" id="main-reg-phone-confirm">인증 완료</button>
                    </div>
                </div>
                <p class="register-error" id="main-reg-phone-error"></p>
                <p class="register-footer" style="margin-top:6px;font-size:0.8rem;text-align:left;" id="phone-auth-hint">localhost에서 오류 시: <code>127.0.0.1:8080</code>으로 접속 후, Firebase 콘솔 → 인증 → 설정 → 승인된 도메인에 <code>127.0.0.1</code> 추가</p>
                <p class="register-error" id="main-register-error"></p>
                <div class="register-actions">
                    <button type="submit" class="btn-primary">가입하기</button>
                    <a href="/streams.html" class="btn-secondary">취소</a>
                </div>
            </form>
            <p class="register-footer">이미 계정이 있으신가요? <a href="/index.html">로그인</a></p>
        </div>
    </main>

    <script>
        (function () {
            var THEME_KEY = 'gamematcher-theme';
            var body = document.body;
            function applyTheme(theme) {
                body.classList.remove('theme-dark', 'theme-light');
                body.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
            }
            var saved = (function () { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })();
            applyTheme(saved === 'light' ? 'light' : 'dark');
            document.getElementById('btn-theme').addEventListener('click', function () {
                applyTheme(body.classList.contains('theme-dark') ? 'light' : 'dark');
            });

            var mainIdCheckedOk = false;
            var mainPhoneVerified = false;
            var mainPhoneVerifiedNumber = '';
            document.getElementById('main-reg-loginId').addEventListener('input', function () {
                mainIdCheckedOk = false;
                document.getElementById('main-msg-loginId').textContent = '';
            });
            document.getElementById('main-btn-check-loginId').addEventListener('click', function () {
                var v = document.getElementById('main-reg-loginId').value.trim();
                var msg = document.getElementById('main-msg-loginId');
                if (v.length < 5) { msg.textContent = '5자 이상 입력 후 중복확인해 주세요.'; msg.className = 'check-msg fail'; return; }
                fetch('/api/auth/check/loginId?value=' + encodeURIComponent(v), { credentials: 'include' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        mainIdCheckedOk = d.available;
                        msg.textContent = d.available ? '사용 가능한 아이디입니다.' : '이미 사용 중인 아이디입니다.';
                        msg.className = 'check-msg ' + (d.available ? 'ok' : 'fail');
                    })
                    .catch(function () { msg.textContent = '확인할 수 없습니다.'; msg.className = 'check-msg fail'; });
            });

            var sendBtn = document.getElementById('main-reg-phone-send');
            var confirmBtn = document.getElementById('main-reg-phone-confirm');
            var phoneInput = document.getElementById('main-reg-phone');
            var codeWrap = document.getElementById('main-reg-phone-code-wrap');
            var codeInput = document.getElementById('main-reg-phone-code');
            var errEl = document.getElementById('main-reg-phone-error');
            function showErr(m) { if (errEl) errEl.textContent = m || ''; }
            function phoneAuthErrMessage(err) {
                if (err) console.error('[휴대폰 인증]', err.code, err.message);
                if (!err || !err.code) return window.toKoreanErrorMessage(err && err.message) || '인증에 실패했습니다.';
                var code = String(err.code);
                var codeLower = code.toLowerCase();
                var codeShort = code.replace(/^auth\/?/i, '');
                if (codeLower.indexOf('billing-not-enabled') !== -1) return '휴대폰 인증은 Firebase 결제(Blaze) 활성화 후 이용 가능합니다. (' + codeShort + ')';
                if (codeLower.indexOf('invalid-app-credential') !== -1 || codeLower.indexOf('invalid_app_credential') !== -1) return '인증 설정을 확인해 주세요. Firebase 콘솔·API 키·승인된 도메인을 확인하세요. (' + codeShort + ')';
                if (codeLower.indexOf('too-many-requests') !== -1) return '요청이 많습니다. 잠시 후 다시 시도해 주세요. (반복 실패 시 먼저 인증 설정을 확인하세요)';
                if (codeLower.indexOf('invalid-phone-number') !== -1) return '올바른 휴대폰 번호를 입력해 주세요. (' + codeShort + ')';
                return (window.toKoreanErrorMessage(err.message) || '인증에 실패했습니다.') + ' (' + codeShort + ')';
            }
            if (sendBtn && phoneInput) sendBtn.addEventListener('click', function () {
                var raw = phoneInput.value.trim();
                showErr('');
                if (!raw) { showErr('휴대폰 번호를 입력해 주세요.'); return; }
                sendBtn.disabled = true;
                sendBtn.textContent = '발송 중...';
                if (!window.firebasePhoneAuth) { sendBtn.disabled = false; sendBtn.textContent = '문자 인증'; showErr('인증 기능을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
                window.firebasePhoneAuth.sendPhoneVerificationCode(raw).then(function () {
                    sendBtn.disabled = false;
                    sendBtn.textContent = '문자 인증';
                    if (codeWrap) codeWrap.style.display = 'block';
                    if (codeInput) { codeInput.value = ''; codeInput.focus(); }
                    mainPhoneVerifiedNumber = raw.replace(/\D/g, '');
                    if (mainPhoneVerifiedNumber.length === 10 && mainPhoneVerifiedNumber.startsWith('10')) mainPhoneVerifiedNumber = '82' + mainPhoneVerifiedNumber;
                    else if (mainPhoneVerifiedNumber.length === 9) mainPhoneVerifiedNumber = '82' + mainPhoneVerifiedNumber;
                    else if (mainPhoneVerifiedNumber.startsWith('0')) mainPhoneVerifiedNumber = '82' + mainPhoneVerifiedNumber.slice(1);
                    showErr('');
                }).catch(function (err) {
                    sendBtn.disabled = false;
                    sendBtn.textContent = '문자 인증';
                    showErr(phoneAuthErrMessage(err));
                });
            });
            if (confirmBtn && codeInput) confirmBtn.addEventListener('click', function () {
                var code = codeInput.value.trim();
                showErr('');
                if (!code) { showErr('인증 코드를 입력해 주세요.'); return; }
                confirmBtn.disabled = true;
                confirmBtn.textContent = '확인 중...';
                if (!window.firebasePhoneAuth) { confirmBtn.disabled = false; confirmBtn.textContent = '인증 완료'; return; }
                window.firebasePhoneAuth.confirmPhoneCode(code).then(function () {
                    mainPhoneVerified = true;
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '인증 완료';
                    showErr('');
                }).catch(function (err) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = '인증 완료';
                    showErr(phoneAuthErrMessage(err));
                });
            });

            document.getElementById('main-reg-password2').addEventListener('input', function () {
                var m = document.getElementById('main-msg-password2');
                if (!this.value) { m.textContent = ''; return; }
                m.textContent = this.value === document.getElementById('main-reg-password').value ? '비밀번호가 일치합니다.' : '비밀번호가 일치하지 않습니다.';
                m.className = 'check-msg ' + (this.value === document.getElementById('main-reg-password').value ? 'ok' : 'fail');
            });

            document.getElementById('form-register').addEventListener('submit', function (e) {
                e.preventDefault();
                var err = document.getElementById('main-register-error');
                err.textContent = '';
                var pw = document.getElementById('main-reg-password').value;
                var pw2 = document.getElementById('main-reg-password2').value;
                if (pw !== pw2) { err.textContent = '비밀번호가 일치하지 않습니다.'; return; }
                if (!mainIdCheckedOk) { err.textContent = '아이디 중복확인을 해주세요.'; return; }
                if (!mainPhoneVerified) { err.textContent = '휴대전화 인증을 완료해 주세요.'; return; }
                var payload = {
                    loginId: document.getElementById('main-reg-loginId').value.trim(),
                    password: pw,
                    username: document.getElementById('main-reg-username').value,
                    nickname: (document.getElementById('main-reg-nickname') && document.getElementById('main-reg-nickname').value) || '',
                    email: document.getElementById('main-reg-email').value.trim(),
                    phone: (document.getElementById('main-reg-phone') && document.getElementById('main-reg-phone').value) || ''
                };
                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                })
                    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                    .then(function (res) {
                        if (res.ok) { window.location.href = '/streams.html'; }
                        else { err.textContent = window.toKoreanErrorMessage(res.data && res.data.message) || '회원가입에 실패했습니다.'; }
                    })
                    .catch(function () { err.textContent = '회원가입 요청이 실패했습니다.'; });
            });
        })();
    </script>
</body>
</html>
