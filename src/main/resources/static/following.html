<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팔로잉 - GameMatcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/typography-glitch.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <script type="module" src="/js/firebase-init.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; min-height: 100vh; display: flex; flex-direction: column; transition: background 0.2s, color 0.2s; }
        body.theme-dark { background: #0d0d0f; color: #f5f5f5; }
        body.theme-light { background: #f0f0f2; color: #1a1a1d; }
        a { color: inherit; text-decoration: none; }
        a:hover { color: #00e676; }
        .header { height: 56px; border-bottom: 1px solid; display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        body.theme-dark .header { background: #18181b; border-color: #2c2c2e; }
        body.theme-light .header { background: #fff; border-color: #e5e5e7; }
        .header-logo { font-weight: 700; font-size: 1.35rem; color: #00e676; margin-right: 32px; }
        .header-nav { display: flex; gap: 28px; }
        .header-nav a { font-size: 0.95rem; font-weight: 500; }
        body.theme-dark .header-nav a { color: #b0b0b5; }
        body.theme-light .header-nav a { color: #53535a; }
        .header-search { flex: 1; max-width: 400px; margin: 0 24px; height: 40px; border: none; border-radius: 8px; padding: 0 16px; font-size: 0.9rem; }
        body.theme-dark .header-search { background: #2c2c2e; color: #fff; }
        body.theme-light .header-search { background: #e5e5e7; color: #1a1a1d; }
        .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .header-right .no-auth { display: inline-block; }
        .header-right .auth-only { display: none; }
        body.logged-in .header-right .no-auth { display: none; }
        body.logged-in .header-right .auth-only { display: inline-flex !important; }
        .header .header-profile-wrap { position: relative; }
        .header .header-profile-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #00e676; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #2c2c2e; }
        body.theme-light .header .header-profile-avatar { background: #e5e5e7; }
        .header .header-profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .header .header-profile-avatar .avatar-placeholder { width: 24px; height: 24px; color: #6b6b70; }
        .header .header-profile-dropdown { display: none; position: absolute; top: calc(100% + 8px); right: 0; min-width: 220px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 1001; }
        body.theme-dark .header .header-profile-dropdown { background: #1e1e21; border: 1px solid #2c2c2e; }
        body.theme-light .header .header-profile-dropdown { background: #fff; border: 1px solid #e5e5e7; }
        .header .header-profile-dropdown.show { display: block; }
        .header .dropdown-menu { padding: 8px 0; }
        .header .dropdown-menu a, .header .dropdown-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 16px; border: none; background: none; color: inherit; font-size: 0.9rem; font-family: inherit; cursor: pointer; text-align: left; text-decoration: none; }
        body.theme-dark .header .dropdown-menu a:hover, body.theme-dark .header .dropdown-menu button:hover { background: #2c2c2e; }
        body.theme-light .header .dropdown-menu a:hover, body.theme-light .header .dropdown-menu button:hover { background: #e5e5e7; }
        .btn-theme { width: 40px; height: 40px; border-radius: 8px; border: 1px solid; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        .btn-theme .icon-sun { display: none; }
        .btn-theme .icon-moon { display: none; }
        body.theme-dark .btn-theme .icon-sun { display: block; }
        body.theme-light .btn-theme .icon-moon { display: block; }
        body.theme-dark .btn-theme { border-color: #3a3a3d; color: #b0b0b5; }
        body.theme-light .btn-theme { border-color: #d0d0d2; color: #53535a; }
        .btn-login { padding: 0.5rem 1rem; background: transparent; border: 1px solid; border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 500; }
        body.theme-dark .btn-login { color: #b0b0b5; border-color: #3a3a3d; }
        body.theme-light .btn-login { color: #53535a; border-color: #d0d0d2; }
        .layout { display: flex; flex: 1; min-height: 0; width: 100%; }
        .sidebar { width: 200px; min-width: 200px; flex-shrink: 0; padding: 12px 0; border-right: 1px solid; overflow-y: auto; display: flex; flex-direction: column; }
        body.theme-dark .sidebar { background: #151517; border-color: #2c2c2e; }
        body.theme-light .sidebar { background: #fff; border-color: #e5e5e7; }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 0.875rem; font-weight: 500; border-radius: 0 8px 8px 0; margin: 0 8px 0 0; color: inherit; }
        body.theme-dark .sidebar-item { color: #b0b0b5; }
        body.theme-dark .sidebar-item:hover { color: #fff; background: #1e1e21; }
        body.theme-dark .sidebar-item.active { color: #00e676; background: rgba(0,230,118,0.12); }
        body.theme-light .sidebar-item { color: #53535a; }
        body.theme-light .sidebar-item:hover { color: #00e676; background: #f0fdf4; }
        body.theme-light .sidebar-item.active { color: #00e676; background: rgba(0,230,118,0.12); }
        .sidebar-item .icon { font-size: 1.15rem; width: 22px; text-align: center; flex-shrink: 0; }
        .content { flex: 1; padding: 24px 32px; min-width: 0; min-height: 0; overflow-y: auto; }
        .page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 20px; }
        body.theme-dark .page-title { color: #fff; }
        body.theme-light .page-title { color: #1a1a1d; }
        .following-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .following-tabs button { padding: 0.5rem 1rem; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.2s, color 0.2s; }
        body.theme-dark .following-tabs button { background: #2c2c2e; color: #b0b0b5; }
        body.theme-dark .following-tabs button:hover { color: #fff; background: #3a3a3d; }
        body.theme-dark .following-tabs button.active { background: #fff; color: #0d0d0f; }
        body.theme-light .following-tabs button { background: #e5e5e7; color: #53535a; }
        body.theme-light .following-tabs button:hover { background: #d5d5d7; color: #1a1a1d; }
        body.theme-light .following-tabs button.active { background: #1a1a1d; color: #fff; }
        .following-empty { text-align: center; padding: 64px 24px; }
        .following-empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.8; }
        .following-empty-msg { font-size: 1.1rem; margin-bottom: 24px; }
        body.theme-dark .following-empty-msg { color: #b0b0b5; }
        body.theme-light .following-empty-msg { color: #53535a; }
        .following-empty .btn-go { display: inline-block; padding: 12px 24px; background: #00e676; color: #0d0d0f; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .following-empty .btn-go:hover { background: #33eb91; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { border-radius: 12px; overflow: hidden; display: block; color: inherit; transition: transform 0.2s, box-shadow 0.2s; }
        body.theme-dark .card { background: #1e1e21; }
        body.theme-light .card { background: #fff; border: 1px solid #e5e5e7; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }
        .card-thumb { position: relative; width: 100%; padding-bottom: 56.25%; overflow: hidden; }
        body.theme-dark .card-thumb { background: #0d0d0f; }
        body.theme-light .card-thumb { background: #f0f0f2; }
        .card-thumb-inner { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .card-thumb-inner video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; pointer-events: none; }
        .card-thumb-inner .thumb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .card-thumb .thumb-placeholder { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.85rem; text-align: center; color: #6b6b70; }
        body.theme-dark .card-thumb .thumb-placeholder { background: linear-gradient(180deg, #1a1a1d 0%, #0d0d0f 100%); }
        body.theme-light .card-thumb .thumb-placeholder { background: linear-gradient(180deg, #e8e8ea 0%, #f0f0f2 100%); }
        .card-thumb .live-badge { position: absolute; top: 10px; left: 10px; background: #00e676; color: #0d0d0f; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; z-index: 2; }
        .card-thumb .viewers { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; z-index: 2; }
        .card-body { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
        .card-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
        body.theme-dark .card-avatar { background: #2c2c2e; }
        body.theme-light .card-avatar { background: #e5e5e7; }
        .card-info { min-width: 0; flex: 1; }
        .card-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.theme-dark .card-title { color: #fff; }
        body.theme-light .card-title { color: #1a1a1d; }
        .card-meta { font-size: 0.85rem; color: #6b6b70; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .card-meta .live-dot { width: 6px; height: 6px; background: #00e676; border-radius: 50%; flex-shrink: 0; }
        .card-category { font-size: 0.75rem; display: inline-block; padding: 0.2rem 0.5rem; border-radius: 6px; margin-top: 2px; }
        body.theme-dark .card-category { background: #2c2c2e; color: #9e9ea6; }
        body.theme-light .card-category { background: #e5e5e7; color: #53535a; }
        .badge-external { background: #6366f1; color: #fff; padding: 0.15rem 0.45rem; border-radius: 4px; font-size: 0.7rem; margin-left: 0.35rem; font-weight: 500; }
        .card-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
        .following-section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
        body.theme-dark .following-section-title { color: #e0e0e0; }
        body.theme-light .following-section-title { color: #1a1a1d; }
        .following-online-section { margin-bottom: 28px; }
        .following-offline-section { margin-bottom: 28px; }
        .channel-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; border-radius: 12px; text-decoration: none; color: inherit; transition: background 0.2s; width: 100px; }
        body.theme-dark .channel-chip:hover { background: #1e1e21; }
        body.theme-light .channel-chip:hover { background: #e5e5e7; }
        .channel-chip-avatar { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        body.theme-dark .channel-chip-avatar { background: #2c2c2e; }
        body.theme-light .channel-chip-avatar { background: #e5e5e7; }
        .channel-chip-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .channel-chip-name { font-size: 0.85rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        body.theme-dark .channel-chip-name { color: #fff; }
        body.theme-light .channel-chip-name { color: #1a1a1d; }
        .channel-chips-wrap { display: flex; flex-wrap: wrap; gap: 16px; }
        .empty { color: #6b6b70; padding: 48px 24px; text-align: center; font-size: 0.95rem; }
        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body class="theme-dark">
    <header class="header">
        <a href="/" class="header-logo">GameMatcher</a>
        <nav class="header-nav">
            <a href="/streams.html">전체 방송</a>
            <a href="/streams.html">게임</a>
            <a href="/streams.html">e스포츠</a>
        </nav>
        <input type="text" class="header-search" placeholder="채널, 라이브, 영상 검색">
        <div class="header-right">
            <button type="button" class="btn-theme" id="btn-theme" aria-label="테마 전환"><span class="theme-icon"><svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>
            <a href="/" class="btn-login no-auth" id="btn-login">로그인</a>
            <div class="header-profile-wrap auth-only" id="header-profile-wrap">
                <button type="button" class="header-profile-avatar" id="header-profile-btn" aria-label="프로필 메뉴">
                    <img id="header-profile-img" src="" alt="" style="display:none;" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='block';">
                    <svg class="avatar-placeholder" style="display:block;" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </button>
                <div class="header-profile-dropdown" id="header-profile-dropdown">
                    <div class="dropdown-menu">
                        <a href="/profile.html">내 프로필</a>
                        <a href="/studio.html">스튜디오</a>
                        <a href="/streams.html">방송 보기</a>
                        <button type="button" id="dropdown-logout">로그아웃</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <a href="/streams.html" class="sidebar-item"><span class="icon">📹</span><span>신규 방송</span></a>
            <a href="/streams.html?sort=popular" class="sidebar-item"><span class="icon">🔥</span><span>인기</span></a>
            <a href="/following.html" class="sidebar-item active"><span class="icon">♥</span><span>팔로잉</span></a>
            <a href="/history.html" class="sidebar-item"><span class="icon">🕐</span><span>히스토리</span></a>
            <a href="/studio.html" class="sidebar-item"><span class="icon">⚙</span><span>방송 설정</span></a>
        </aside>
        <main class="content">
            <h1 class="page-title">팔로잉</h1>
            <div class="following-tabs">
                <button type="button" class="tab-btn active" data-type="all">전체</button>
                <button type="button" class="tab-btn" data-type="live">라이브</button>
                <button type="button" class="tab-btn" data-type="recent">최근 동영상</button>
            </div>
            <div id="following-content">
                <p class="empty">로딩 중...</p>
            </div>
        </main>
    </div>
    <script>
        (function () {
            var body = document.body;
            var contentEl = document.getElementById('following-content');
            var THEME_KEY = 'gamematcher-theme';
            function applyTheme(theme) {
                body.classList.remove('theme-dark', 'theme-light');
                body.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');
                try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
            }
            var saved = (function () { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } })();
            applyTheme(saved === 'light' ? 'light' : 'dark');
            document.getElementById('btn-theme').addEventListener('click', function () {
                applyTheme(body.classList.contains('theme-dark') ? 'light' : 'dark');
            });
            function setLoggedIn(user) {
                body.classList.add('logged-in');
                var img = document.getElementById('header-profile-img');
                if (img && user && user.profileImageUrl) {
                    img.src = user.profileImageUrl;
                    img.style.display = 'block';
                    if (img.nextElementSibling) img.nextElementSibling.style.display = 'none';
                }
            }
            function setLoggedOut() {
                body.classList.remove('logged-in');
            }
            var profileBtn = document.getElementById('header-profile-btn');
            var profileDropdown = document.getElementById('header-profile-dropdown');
            if (profileBtn && profileDropdown) {
                profileBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    profileDropdown.classList.toggle('show');
                });
                document.addEventListener('click', function () { profileDropdown.classList.remove('show'); });
                var logoutBtn = document.getElementById('dropdown-logout');
                if (logoutBtn) logoutBtn.addEventListener('click', function () {
                    fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).then(function () {
                        setLoggedOut();
                        profileDropdown.classList.remove('show');
                        contentEl.innerHTML = '<div class="following-empty"><p class="following-empty-msg">로그인하면 팔로우한 채널의 방송을 모아볼 수 있습니다.</p><a href="/" class="btn-go">로그인하기</a></div>';
                    });
                });
            }
            fetch('/api/auth/me', { credentials: 'include' })
                .then(function (r) {
                    if (!r.ok) {
                        setLoggedOut();
                        contentEl.innerHTML = '<div class="following-empty"><p class="following-empty-msg">로그인하면 팔로우한 채널의 방송을 모아볼 수 있습니다.</p><a href="/" class="btn-go">로그인하기</a></div>';
                        return null;
                    }
                    return r.json();
                })
                .then(function (user) {
                    if (user) {
                        setLoggedIn(user);
                        load();
                    }
                })
                .catch(function () {
                    setLoggedOut();
                    contentEl.innerHTML = '<div class="following-empty"><p class="following-empty-msg">로그인하면 팔로우한 채널의 방송을 모아볼 수 있습니다.</p><a href="/" class="btn-go">로그인하기</a></div>';
                });

            var currentType = 'all';
            function gameLabel(game) {
                var map = { LEAGUE_OF_LEGENDS: '리그 오브 레전드', VALORANT: '발로란트', OVERWATCH: '오버워치', PUBG: 'PUBG', COUNTER_STRIKE_2: '카운터 스트라이크 2', APEX_LEGENDS: '에이펙스 레전드', OTHERS: '기타' };
                return map[game] || game || '';
            }
            function escapeHtml(str) {
                if (str == null) return '';
                var div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            function cardHtml(s, withThumbnail) {
                var isLive = (s.status || '').toUpperCase() === 'LIVE';
                var isExternal = !!s.externalUrl;
                var liveBadge = isLive ? '<span class="live-badge">LIVE</span>' : '';
                var count = (s.viewerCount != null && s.viewerCount !== undefined) ? s.viewerCount : 0;
                var viewers = isLive ? '<span class="viewers">' + count + '명 시청 중</span>' : '';
                var extBadge = isExternal ? '<span class="badge-external">트위치/유튜브</span>' : '';
                var thumb = '';
                if (withThumbnail && isLive && s.playbackUrl) {
                    thumb = '<div class="card-thumb-inner"><video muted playsinline autoplay data-playback-url="' + (s.playbackUrl || '').replace(/"/g, '&quot;') + '"></video><canvas class="thumb-canvas"></canvas></div>';
                }
                if (!thumb) {
                    thumb = '<div class="thumb-placeholder">' + (isLive ? '🔴 방송 중' : '') + (s.game ? '<br><span style="font-size:0.75rem">' + gameLabel(s.game) + '</span>' : '') + '</div>';
                }
                var liveDot = isLive ? '<span class="live-dot"></span>' : '';
                var avatarImg = (s.broadcasterProfileImageUrl) ? '<img src="' + escapeHtml(s.broadcasterProfileImageUrl) + '" alt="">' : '';
                return '<a class="card" href="/watch.html?streamId=' + s.id + '">' +
                    '<div class="card-thumb">' + liveBadge + viewers + thumb + '</div>' +
                    '<div class="card-body"><div class="card-avatar">' + avatarImg + '</div><div class="card-info">' +
                    '<div class="card-title">' + (s.title || '방송') + extBadge + '</div>' +
                    '<div class="card-meta">' + liveDot + (s.broadcasterNickname || '방송자') + '</div>' +
                    '<div class="card-category">' + gameLabel(s.game) + '</div>' +
                    '</div></div></a>';
            }
            function renderEmpty() {
                contentEl.innerHTML = '<div class="following-empty">' +
                    '<div class="following-empty-icon">♥</div>' +
                    '<p class="following-empty-msg">팔로우한 채널이 없습니다.</p>' +
                    '<a href="/streams.html" class="btn-go">다른 방송 보러 가기</a></div>';
            }
            function renderLiveEmpty() {
                contentEl.innerHTML = '<div class="following-empty">' +
                    '<div class="following-empty-icon">♥</div>' +
                    '<p class="following-empty-msg">진행 중인 라이브가 없습니다.</p>' +
                    '<a href="/streams.html" class="btn-go">다른 방송 보러 가기</a></div>';
            }
            function renderList(list) {
                if (!list || list.length === 0) {
                    renderEmpty();
                    return;
                }
                contentEl.innerHTML = '<div class="grid">' + list.map(function (s) { return cardHtml(s, (s.status || '').toUpperCase() === 'LIVE'); }).join('') + '</div>';
                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    contentEl.querySelectorAll('.card-thumb-inner').forEach(function (inner) {
                        var video = inner.querySelector('video[data-playback-url]');
                        var canvas = inner.querySelector('.thumb-canvas');
                        if (!video || !canvas) return;
                        var url = video.getAttribute('data-playback-url');
                        if (!url) return;
                        var hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, function () { setTimeout(function () {
                            if (video.readyState >= 2 && video.videoWidth > 0) {
                                var w = inner.offsetWidth, h = inner.offsetHeight;
                                if (w && h) { canvas.width = w; canvas.height = h; var ctx = canvas.getContext('2d'); if (ctx) ctx.drawImage(video, 0, 0, w, h); }
                            }
                        }, 500); });
                    });
                }
            }
            function renderAllWithOnlineOffline(followList, streams) {
                var liveStreams = (streams || []).filter(function (s) { return (s.status || '').toUpperCase() === 'LIVE'; });
                var liveUserIds = {};
                liveStreams.forEach(function (s) {
                    var id = s.broadcasterUserId || s.userId;
                    if (id != null) liveUserIds[String(id)] = true;
                });
                var offlineList = followList.filter(function (f) { return !liveUserIds[String(f.userId)]; });
                var html = '';
                if (liveStreams.length > 0) {
                    html += '<div class="following-online-section"><h3 class="following-section-title">온라인</h3><div class="grid">' +
                        liveStreams.map(function (s) { return cardHtml(s, true); }).join('') + '</div></div>';
                }
                if (offlineList.length > 0) {
                    html += '<div class="following-offline-section"><h3 class="following-section-title">오프라인</h3><div class="channel-chips-wrap">' +
                        offlineList.map(function (f) {
                            var name = escapeHtml(f.nickname || '유저');
                            var img = (f.profileImageUrl) ? '<img src="' + escapeHtml(f.profileImageUrl) + '" alt="">' : '';
                            return '<a class="channel-chip" href="/profile.html?userId=' + (f.userId || '') + '"><div class="channel-chip-avatar">' + img + '</div><span class="channel-chip-name">' + name + '</span></a>';
                        }).join('') + '</div></div>';
                }
                if (!html) {
                    renderEmpty();
                } else {
                    contentEl.innerHTML = html;
                    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        contentEl.querySelectorAll('.card-thumb-inner').forEach(function (inner) {
                            var video = inner.querySelector('video[data-playback-url]');
                            var canvas = inner.querySelector('.thumb-canvas');
                            if (!video || !canvas) return;
                            var url = video.getAttribute('data-playback-url');
                            if (!url) return;
                            var hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                            hls.on(Hls.Events.MANIFEST_PARSED, function () { setTimeout(function () {
                                if (video.readyState >= 2 && video.videoWidth > 0) {
                                    var w = inner.offsetWidth, h = inner.offsetHeight;
                                    if (w && h) { canvas.width = w; canvas.height = h; var ctx = canvas.getContext('2d'); if (ctx) ctx.drawImage(video, 0, 0, w, h); }
                                }
                            }, 500); });
                        });
                    }
                }
            }
            function load() {
                contentEl.innerHTML = '<p class="empty">로딩 중...</p>';
                fetch('/api/follow/list', { credentials: 'include' })
                    .then(function (r) {
                        if (!r.ok) return r.json().then(function () { throw new Error(); });
                        return r.json();
                    })
                    .then(function (data) {
                        var list = data.list || [];
                        if (list.length === 0) {
                            renderEmpty();
                            return;
                        }
                        if (currentType === 'live') {
                            return fetch('/api/streams/following?type=live', { credentials: 'include' })
                                .then(function (r) { return r.json(); })
                                .then(function (streams) {
                                    if (!streams || streams.length === 0) {
                                        renderLiveEmpty();
                                        return;
                                    }
                                    renderList(streams);
                                })
                                .catch(function () { renderLiveEmpty(); });
                        }
                        if (currentType === 'recent') {
                            return fetch('/api/streams/following?type=recent', { credentials: 'include' })
                                .then(function (r) { return r.json(); })
                                .then(function (streams) {
                                    if (!streams || streams.length === 0) { renderEmpty(); return; }
                                    renderList(streams);
                                })
                                .catch(function () { renderEmpty(); });
                        }
                        return fetch('/api/streams/following?type=all', { credentials: 'include' })
                            .then(function (r) { return r.json(); })
                            .then(function (streams) {
                                renderAllWithOnlineOffline(list, streams || []);
                            })
                            .catch(function () {
                                contentEl.innerHTML = '<div class="following-empty"><p class="following-empty-msg">팔로우한 채널이 없거나 목록을 불러올 수 없습니다.</p><a href="/streams.html" class="btn-go">다른 방송 보러 가기</a></div>';
                            });
                    })
                    .catch(function () {
                        contentEl.innerHTML = '<div class="following-empty"><p class="following-empty-msg">팔로우한 채널이 없거나 목록을 불러올 수 없습니다.</p><a href="/streams.html" class="btn-go">다른 방송 보러 가기</a></div>';
                    });
            }
            document.querySelectorAll('.tab-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    currentType = btn.getAttribute('data-type') || 'all';
                    load();
                });
            });
            load();
        })();
    </script>
</body>
</html>
