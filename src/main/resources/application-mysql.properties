# MySQL (프로필: mysql), 예: mvn spring-boot:run -Dspring-boot.run.profiles=mysql,oauth
#
# 권장: 팀원 각자 PC/배포 환경에서 아래 표준 환경 변수만 설정 (Spring Boot 기본 이름).
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#
# 로컬에서 Repo 기본값만 쓰지 않으려면:
#   application-mysql-local.properties.example 참고해 application-mysql-local.properties 생성 (gitignore 됨).
#   이 프로필 마지막의 spring.config.import 가 있으면 해당 파일이 기본값을 덮어씁니다.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/gamematcher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# CORS / OAuth 리다이렉트 (프론트 분리 실행 시). APP_FRONTEND_URL 로 통일.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# application-oauth.properties + GOOGLE_CLIENT_ID 등은 기존과 동일 (비밀은 application-oauth-local.properties 권장)

spring.config.import=optional:classpath:application-mysql-local.properties
