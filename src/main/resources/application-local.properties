# 로컬 테스트용: RDS 없이 H2 인메모리 DB (MariaDB 대체)
# 실행: mvn spring-boot:run -Dspring-boot.run.profiles=local
# 또는 IDE Run Configuration → Active profiles: local
#
# 일부 네이티브 쿼리·DB 전용 문법은 RDS/MariaDB와 다를 수 있음.
#
# DevTools 재시작 클래스로더 + JPA 조합 시 "Not a managed type" 방지
spring.devtools.restart.enabled=false

spring.datasource.url=jdbc:h2:mem:gamematcher;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 콘솔: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:gamematcher)

# 저장소 기본값이 localhost 이면 아래 origin 목록은 application.properties 와 겹칠 수 있음 (local 프로필 분리용으로 유지).
app.frontend.url=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
app.frontend.base-url=http://localhost:5173
app.backend.base-url=http://localhost:8080

# 구글 OAuth 콜백만 로컬 URI로 (Google 콘솔에 동일 URI 등록 필요). 카카오·네이버는 {baseUrl} 유지.
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
